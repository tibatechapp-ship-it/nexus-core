name: Tests

on:
  # PR events already cover every branch, so pushing a feature branch must not
  # double the run (it used to: `branches: ["**"]` + `pull_request` = 2 identical
  # workflows per push, doubling CI minutes).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Run the pytest suite with coverage on every supported Python ──────────
  test:
    name: pytest (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      NEXUS_ALLOW_OPEN: "1"
      NOVAMIND_HOME: ${{ github.workspace }}
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps (framework + novamind layer, flat — no editable install)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov textual pytest-textual-snapshot \
            pytest-asyncio pytest-benchmark syrupy \
            fastapi uvicorn pydantic-settings httpx aiofiles jinja2 pyyaml \
            sqlalchemy aiosqlite python-jose passlib python-multipart \
            prometheus-client opentelemetry-api opentelemetry-sdk \
            opentelemetry-exporter-otlp-proto-grpc

      # ── Layer 1: the stdlib-only framework (hard gate, ≥95% coverage) ──────
      - name: Framework test suite with coverage (floor 95%)
        run: pytest --cov --cov-fail-under=95 --ignore=tests/novamind

      # ── Layer 2: the former novamind package (its own env + data) ──────────
      - name: Set up novamind test data
        run: |
          mkdir -p data/company
          [ ! -f data/company/constitution.json ] && echo '{"rules":[],"meta":{}}' > data/company/constitution.json || true
          [ ! -f data/company/genome.json ] && echo '{"traits":{},"meta":{}}' > data/company/genome.json || true
          [ ! -f data/company/reputation.json ] && echo '{"scores":{},"meta":{}}' > data/company/reputation.json || true
          [ ! -f data/company/costs.json ] && echo '{"total":0,"by_day":{},"by_agent":{},"limit":100,"used":0}' > data/company/costs.json || true
          python - <<'PY'
          import sqlite3, os
          os.makedirs('data/company', exist_ok=True)
          for db in ['memory.db', 'soldiers.db', 'rag_memory.db', 'vector_memory.db']:
              p = f'data/company/{db}'
              if not os.path.exists(p):
                  conn = sqlite3.connect(p)
                  conn.execute('CREATE TABLE IF NOT EXISTS data (id INTEGER PRIMARY KEY, value TEXT)')
                  conn.commit()
                  conn.close()
          print('novamind test data ready')
          PY

      - name: Novamind gate — unit + observability (scope its CI verified)
        run: pytest tests/novamind/unit tests/novamind/observability --tb=short
        continue-on-error: true
        env:
          ZAI_API_KEY_1: test
          GROQ_API_KEY_1: test

      - name: Novamind full suite (non-blocking report)
        if: always()
        continue-on-error: true
        run: |
          pytest tests/novamind --cov=src/novamind --cov-report=term --tb=line || true
        env:
          ZAI_API_KEY_1: test
          GROQ_API_KEY_1: test
  # ── Publish a shields.io coverage badge (no external service needed) ──────
  coverage-badge:
    name: publish coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NOVAMIND_HOME: ${{ github.workspace }}
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Mirror the framework gate's deps EXACTLY. A thinner set (no fastapi/httpx/
      # sqlalchemy) makes workbench test modules fail at import → pytest exit 2.
      - name: Install test deps (mirror the framework gate)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov textual pytest-textual-snapshot \
            pytest-asyncio pytest-benchmark syrupy \
            fastapi uvicorn pydantic-settings httpx aiofiles jinja2 pyyaml \
            sqlalchemy aiosqlite python-jose passlib python-multipart \
            prometheus-client opentelemetry-api opentelemetry-sdk \
            opentelemetry-exporter-otlp-proto-grpc

      # Same command as Layer 1 of the `test` job so the badge reflects the
      # GATED coverage (framework surface) — not a degraded no-deps run.
      - name: Measure coverage (same command as the framework gate)
        run: pytest --cov --cov-fail-under=95 --ignore=tests/novamind -q

      - name: Write shields endpoint badge
        run: |
          # --fail-under=0: coverage json re-reads fail_under from pyproject.toml
          # and would fail here. The pytest step above (--cov-fail-under=95) is
          # the real coverage gate; this step only builds the shields badge.
          python -m coverage json -o coverage.json --fail-under=0
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("coverage.json").read_text())
          pct = round(data["totals"]["percent_covered"])
          color = ("brightgreen" if pct >= 90 else "green" if pct >= 80
                   else "yellowgreen" if pct >= 70 else "yellow"
                   if pct >= 60 else "red")
          payload = {"schemaVersion": 1, "label": "coverage",
                     "message": f"{pct}%", "color": color}
          dest = pathlib.Path(".github/badges/coverage.json")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(json.dumps(payload, indent=2) + "\n")
          print(f"coverage = {pct}% ({color})")
          PY
          rm -f coverage.json

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          if git diff --cached --quiet; then
            echo "Badge unchanged."
          else
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi
