name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Deterministic clock for every job (any time-formatted assertion sees UTC).
env:
  TZ: UTC

jobs:
  # ── Lint / type-check / syntax across supported Python versions ───────────
  lint:
    name: lint & type-check (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags, for the version-sync guard

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy textual

      - name: Byte-compile (syntax check)
        run: |
          python -m py_compile zyvo-telegram.py zyvo-voice.py
          python -m compileall -q src

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Mypy type-check
        run: mypy zyvo-telegram.py zyvo-voice.py src nexus_agent.py

      - name: Type-hint coverage (every function annotated)
        run: python scripts/check_annotations.py

      - name: Version consistency (pyproject == src == openapi == tag)
        run: python scripts/check_version_sync.py

  # ── Security: make sure no secret ever lands in the tree ──────────────────
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject committed secrets / env files
        run: |
          fail=0
          if git ls-files | grep -E '(^|/)\.env$|telegram\.env$'; then
            echo "::error::A secrets file is tracked in git."
            fail=1
          fi
          if git grep -nE '[0-9]{8,10}:[A-Za-z0-9_-]{35}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':(exclude)*.md' ':(exclude)tests/novamind/**' 2>/dev/null; then
            echo "::error::Possible hardcoded secret found."
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then echo "No secrets detected."; fi
          exit $fail

  # ── SAST: Bandit security scan on the agent / BYOK surface ────────────────
  sast:
    name: bandit SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit dependencies (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --desc on

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      # Real gate (NO `|| true`): the job fails on any MEDIUM+ finding in the
      # security-relevant surface this project owns.  Pre-existing HIGH findings
      # in the legacy workbench layer (src/agent_loop/tools.py B602 shell=True,
      # src/orchestrator/agent_cache.py B324 MD5) are tracked separately and are
      # intentionally outside this scope.
      - name: Bandit (medium+ severity, agent surface)
        run: |
          bandit -r connectors hyper_app hyper_agent.py \
            src/learning src/knowledge src/skills src/security \
            -ll -q
