name: MIZAN Pull Request Security Scan

on:
  pull_request:
  workflow_dispatch:

# Untrusted pull-request code is analyzed without executing repository scripts,
# installing project dependencies, receiving secrets, or writing to the repo.
# Two independent read-only jobs:
#   1. codeql          — first-party static analysis (actions only, no run steps).
#   2. mizan-evidence  — the pinned MIZAN engine full scan producing an
#                        immutable evidence contract (mizan.pr-evidence.v1).
# The engine itself is first-party code installed at an immutable upstream
# commit; the PR's code is only ever READ by it, never executed.
permissions:
  contents: read

concurrency:
  group: mizan-pr-${{ github.event.pull_request.number || github.run_number }}
  cancel-in-progress: true

jobs:
  codeql:
    name: Read-only static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - name: Analyze source
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  mizan-evidence:
    name: MIZAN evidence / full-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The evidence adapter is trusted tooling pinned to an immutable main commit.
      # Never execute scripts from the PR checkout being scanned.
      - name: Checkout trusted evidence adapter
        uses: actions/checkout@v7
        with:
          ref: 51430b2606aeccc842de37dbc43fee13e429a4be
          path: mizan-tool
          persist-credentials: false

      # The candidate repository is data only, isolated in a separate directory.
      - name: Checkout exact PR revision as scan input
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned MIZAN engine
        run: |
          python -m pip install --upgrade pip
          # Immutable upstream engine pin — resolves to the v0.17.0-dev wave-2
          # tag at the time of recording. Tags are mutable; commits are not.
          # Bump via a dedicated chore commit, never in a feature PR.
          python -m pip install "git+https://github.com/tibatechapp-ship-it/MIZAN.git@f68053c6b43a0481bd077a121eedb163d00b4073"

      - name: Run full scan and build evidence contract
        id: scan
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          # The adapter currently captures MIZAN stdout/stderr before emitting them.
          # Suppress raw output: scanner diagnostics may contain source-derived values.
          set +e
          python mizan-tool/scripts/mizan/build_pr_evidence.py --repo target --output reports/mizan/pr-evidence.json > "$RUNNER_TEMP/mizan-adapter.log" 2>&1
          adapter_status=$?
          set -e
          echo "MIZAN evidence adapter exit code: $adapter_status"
          if [ "$adapter_status" -ne 0 ]; then
            echo "::error::MIZAN evidence generation failed; raw scanner output was suppressed to prevent secret disclosure."
          fi
          exit "$adapter_status"

      - name: Upload MIZAN evidence
        id: upload
        if: always() && hashFiles('reports/mizan/pr-evidence.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: mizan-evidence-pr-${{ github.event.pull_request.number || github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/mizan/pr-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish report link in workflow summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "## MIZAN PR Evidence"
            echo
            echo "- Pull request: #${PR_NUMBER}"
            echo "- Scanned revision: ${HEAD_SHA}"
            if [ -n "$ARTIFACT_URL" ]; then
              echo "- Evidence report: [Download JSON report]($ARTIFACT_URL)"
            else
              echo "- Evidence report: not produced or upload failed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
