name: MIZAN PR Evidence Scan

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]

# The scan executes no code from the PR and has no write-capable token.
permissions:
  contents: read

concurrency:
  group: mizan-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mizan-evidence:
    name: MIZAN evidence / full-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned MIZAN engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/tibatechapp-ship-it/MIZAN.git@7aded07aae5b1d609a48b0204f534f9e45720e3f"

      - name: Run full scan and build evidence contract
        id: scan
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/mizan/build_pr_evidence.py --output reports/mizan/pr-evidence.json

      - name: Upload MIZAN evidence
        id: upload
        if: always() && hashFiles('reports/mizan/pr-evidence.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: mizan-evidence-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: reports/mizan/pr-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish report link in workflow summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "## MIZAN PR Evidence"
            echo
            echo "- Pull request: #${PR_NUMBER}"
            echo "- Scanned revision: ${HEAD_SHA}"
            if [ -n "$ARTIFACT_URL" ]; then
              echo "- Evidence report: [Download JSON report]($ARTIFACT_URL)"
            else
              echo "- Evidence report: not produced or upload failed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
