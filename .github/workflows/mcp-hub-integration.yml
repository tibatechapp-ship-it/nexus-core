name: MCP Hub external integration

on:
  pull_request:
    paths:
      - "src/mcp/**"
      - "tests/test_external_mcp.py"
      - "pytest.ini"
      - ".github/workflows/mcp-hub-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: real MCP Hub subprocess
    runs-on: ubuntu-latest
    env:
      NEXUS_ALLOW_OPEN: "1"
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pytest-cov \
            fastapi uvicorn pydantic-settings httpx aiofiles jinja2 pyyaml \
            sqlalchemy aiosqlite python-jose passlib python-multipart \
            prometheus-client opentelemetry-api opentelemetry-sdk \
            opentelemetry-exporter-otlp-proto-grpc \
            'mcp>=1.27,<3' \
            https://github.com/tibatechapp-ship-it/mcp-hub/releases/download/v1.10.0/mcp_hub-1.10.0-py3-none-any.whl

      - name: External MCP unit + real-process tests
        run: pytest tests/test_external_mcp.py -q --tb=short
