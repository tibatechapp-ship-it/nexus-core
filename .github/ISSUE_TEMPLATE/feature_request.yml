name: Feature request
description: Suggest a new capability or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the need or frustration, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: layer
    attributes:
      label: Which layer would this touch?
      options:
        - Framework
        - Council workbench
        - novamind server layer
        - MCP
        - Autopilot SCM
        - Docs / tooling
        - Not sure
    validations:
      required: true
