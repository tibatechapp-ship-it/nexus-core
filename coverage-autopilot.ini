# Coverage profile for the autopilot slices (src/novamind/autopilot).
#
# The repo-wide pyproject profile omits src/novamind/* (the legacy novamind
# server layer ships with its own coverage story). The autopilot package is NEW,
# fully unit-tested code, so it must be measured and held to the 95% floor.
#
# Run:
#   COVERAGE_RCFILE=coverage-autopilot.ini \
#     python -m pytest tests/test_autopilot_scm_*.py \
#     --cov=src/novamind/autopilot --cov-report=term-missing --cov-fail-under=95
[run]
branch = True
source = src/novamind/autopilot

[report]
show_missing = True
skip_empty = True
fail_under = 95

[paths]
source =
    src/novamind/autopilot
    */src/novamind/autopilot
