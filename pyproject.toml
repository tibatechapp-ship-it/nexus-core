[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-core"
version = "1.13.5"
description = "Unified AI Agent System: Memory + Learning + Security + 20 Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "tibatechapp-ship-it" }]
keywords = ["multi-agent", "orchestration", "llm", "ai", "memory", "learning", "security", "termux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Android",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
    "Topic :: Software Development :: Libraries",
]

# Core runtime (the 20-agent framework, memory, learning, security scanner,
# TUI) is the Python standard library only — it runs on the phone with zero
# installs. The former novamind server layer (FastAPI orchestration, RAG,
# observability) is opt-in via the `novamind` extras so the phone stays light.
[project.optional-dependencies]
voice = ["gTTS>=2.5.0", "SpeechRecognition>=3.10.0"]
tui = ["textual>=0.80", "rich>=13"]
# Ed25519 build signing (src/certification). Optional: the signer falls back to
# SHA256 when cryptography is absent (e.g. Termux), so it is never a hard dep.
certification = ["cryptography>=41"]
novamind = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv>=1.2.4",
    "httpx",
    "aiofiles",
    "jinja2",
    "pyyaml",
    "sqlalchemy>=2.1.4",
    "aiosqlite>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
]
observability = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    "prometheus-client>=0.19",
]
rag = [
    "chromadb>=0.4.22",
    "sentence-transformers>=6.1.0",
]
# Remote embedding providers (src/memory/providers/{openai,gemini}.py use the
# OpenAI-compatible client; Gemini is reachable through its OpenAI endpoint).
embeddings = ["openai>=1.0"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "pytest-textual-snapshot",
    "textual>=0.80",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=5.3.0",
    "hypothesis>=6.169.0",
    "syrupy>=4",
]

[project.urls]
Homepage = "https://github.com/tibatechapp-ship-it/nexus-core"
Repository = "https://github.com/tibatechapp-ship-it/nexus-core"
Issues = "https://github.com/tibatechapp-ship-it/nexus-core/issues"

# src-layout: the flat framework package (src.agents, src.core, ...) and the
# former novamind package (src.novamind.*) coexist under one `src/`.
[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["novamind.tests*", "*__pycache__*"]

[tool.setuptools.package-data]
novamind = [
    "registry/data/*.yaml",
    "dashboard/web/*.html",
    "platform/backend/static/*.html",
    "**/*.json",
]

# ─── Linting (ruff) ─────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
# Scope: include framework + workbench layers in gates. Exclude only novamind
# layer and legacy root scripts/docs/legacy (kept separate).
extend-exclude = [
    ".git",
    "__pycache__",
    "docs/legacy",
    "src/novamind",
    "tests/novamind",
    "scripts/novamind",
    "registry_full.py",
    "telegram_notify.py",
    "github_client.py",
    "greeting.py",
    "groq_pool.py",
    "groq_rotator.py",
    "hive_agent_smart.py",
    "hive_security_scanner.py",
    "manager.py",
    "models.py",
    "note.py",
    "post.py",
    "pr_reviewer.py",
    "review_engine.py",
    "safe_runner.py",
    "secure_load_v2.py",
    "security.py",
    "tools.py",
    "unified_agent.py",
    "user.py",
    "webhook_server.py",
    "nova_bridge.py",
]

[tool.ruff.lint]
# Conservative set (E4 = imports, E7 = statements, E9 = runtime/syntax,
# F = pyflakes) — same as the framework's original config, applies repo-wide.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Narrow, intentional exceptions. The whole gated surface (framework +
# workbench layers) keeps E/F clean; only bootstrap/one-liner ordering is
# relaxed where it is genuinely deliberate (runnable entrypoints, compact
# scoring loops). The framework core keeps ZERO ignores.
"src/web/app.py" = ["E402"]
"src/council/rag_bridge.py" = ["E402"]
"src/agent_loop/loop.py" = ["E402"]
"src/orchestrator/supervisor.py" = ["E402"]
"scripts/_run_agent_with_rag.py" = ["E402"]
"src/cli/main.py" = ["E402"]  # bootstrap: sys.path setup must precede src.* imports
"tests/**" = ["E402"]  # pytest.importorskip must run before the target imports

# ─── Type checking (mypy) ───────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
# Optional runtime imports (gTTS, speech_recognition, fastapi...) are imported
# lazily and may be absent — don't fail the build for them.
ignore_missing_imports = true
check_untyped_defs = true
pretty = false
# Scope = the whole gated surface: framework + workbench layers
# (src/{council,web,nexus,orchestrator,agent_loop}) + the workbench files that
# live inside src/memory. Only the novamind layer keeps its own typing legacy
# (verified by its own suite). Mirrors ruff, check_annotations.py and coverage.
exclude = [
    "src/novamind",
    "src/nova",  # legacy (from novamind migration) — kept for reference
]

# ─── pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Framework imports are `src.*` (root on path); novamind imports are
# `novamind.*` (src/ on path) — both styles work.
pythonpath = [".", "src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "adversarial: adversarial attack vector (tests/adversarial)",
    "slow: resource-heavy vector (large payloads)",
    "integration: marks integration tests",
    "unit: marks unit tests",
]
# The deep test-suites (phases 1-5) mix sync and async tests.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ─── coverage ───────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
# Scope mirrors ruff, mypy and check_annotations: the whole gated surface
# (framework + workbench layers) is measured; only the novamind layer, the
# tests and the ops scripts are reported separately.
source = ["src"]
omit = [
    "src/novamind/*",
    "tests/*",
    "scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
# The deep security/performance suites must keep overall coverage this high.
# Measured: 100.00% with the full dependency set, 99.68% when the optional
# extras (sqlite-vec / openai / sse-starlette) are absent, as on GitHub
# Actions. The floor is 99 — high enough to catch any real regression, with
# margin for the optional-dependency skip path (100 would fail on CI alone).
fail_under = 99
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]