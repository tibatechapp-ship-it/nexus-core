# Vale configuration for NovaMind
# Reference: https://vale.sh/docs/topics/config/

StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = NovaMind

[*.md]
BasedOnStyles = Vale, Google, Microsoft

# ─── Google Style tweaks ───
Google.Contractions = YES
Google.Headings = YES
Google.Will = YES
Google.We = NO

# ─── Microsoft Style tweaks ───
Microsoft.Contractions = YES
Microsoft.FirstPerson = NO
Microsoft.Passive = NO
Microsoft.Semicolon = YES
Microsoft.Headings = YES
Microsoft.Adverbs = YES
Microsoft.ComplexWords = YES

# ─── Vale core ───
Vale.Spelling = YES
Vale.Terms = YES
Vale.Repetition = YES
Vale.Avoid = YES
