  /api/ready:
    x-served-by:
    - main.py
    - nexus_agent.py
    get:
      tags:
      - System
      summary: Readiness — Postgres and Redis reachable?
      description: |
        Liveness vs readiness: `/api/health` says the process is alive (and is
        what the container HEALTHCHECK uses); this endpoint says the process can
        serve work. `ready` is true only when every dependency answered, and the
        status code follows the body: 200 ready, 503 not ready. The body shape is
        identical in both cases so a failure is diagnosable from one response.

        Each check reports `mode`: `driver` (real protocol probe — psycopg
        `SELECT 1` / redis `PING`) or `tcp` (driver not installed, TCP connect
        only — never claims more than it proved).
      operationId: getReady
      responses:
        '200':
          description: All dependencies answered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                ready: true
                status: ready
                version: 1.46.0
                checks:
                - name: postgres
                  target: postgres:5432
                  ok: true
                  mode: driver
                  detail: SELECT 1
                  latency_ms: 1.8
                - name: redis
                  target: redis:6379
                  ok: true
                  mode: driver
                  detail: PING
                  latency_ms: 0.6
        '503':
          description: At least one dependency is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                ready: false
                status: not_ready
                version: 1.46.0
                checks:
                - name: postgres
                  target: postgres:5432
                  ok: false
                  mode: driver
                  error: 'OperationalError: could not connect'
                  latency_ms: 2001.4
                - name: redis
                  target: redis:6379
                  ok: true
                  mode: driver
                  detail: PING
                  latency_ms: 0.7
      x-app: main.py
  /api/review:
    x-served-by:
    - main.py
    - nexus_agent.py
    post:
      tags:
      - Review
      summary: Review a local project folder with the live council
      description: |
        Reads up to `max_files` source files (allow-listed extensions) from a
        directory, capped at 30 KB total, and asks the council to review the
        code from 4 angles: structure, security, maintainability, performance.
        Path confinement: the folder must resolve inside $HOME or $TMPDIR.
      operationId: reviewProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - path
              properties:
                path:
                  type: string
                  example: $HOME/nexus-core/src
                max_files:
                  type: integer
                  default: 8
                  minimum: 1
                  maximum: 20
      responses:
        '200':
          description: review result (check ok)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResult'
              example:
                ok: true
                project: src
                files_reviewed: 8
                bytes_reviewed: 26410
                verdict: مقبول
                score: 0.78
                recommendation: تقوية التحقق من المدخلات
                transcript: []
        '401':
          description: auth is enabled (CRAFT_AUTH_TOKEN and/or the gateway's NEXUS_AUTH_TOKEN) and the
            token header is missing/wrong
        '429':
          description: the gateway rate limit is exhausted (Retry-After header set)
        '400':
          description: invalid JSON, empty path, or path containing '..'
        '403':
          description: folder resolves outside $HOME and $TMPDIR
        '404':
          description: path does not exist, is not a folder, or holds no reviewable files
        '503':
          description: council bridge unavailable
        '500':
          description: the council review raised
      x-app: main.py
      x-raw-body: true
      security:
      - AccessToken: []
