openapi: 3.0.3
info:
  title: Nexus Council API
  version: 1.46.0
  description: |-
    Nexus core HTTP contract — TWO apps, one spec.

      * `main.py` (workbench) serves the council/craft API. Each operation marked
        `x-app: main.py` belongs to it.
      * `unified_agent.py` (gateway) serves the workspace, chat, pipeline, training,
        knowledge, skills, verify and maintenance surfaces. `x-app: unified_agent.py`.
      * `x-served-by` lists every app that exposes the path (they run on different
        ports; `/api/health` exists on both with different payloads — pick the one
        you call).

    ERROR MODEL (read first): several routes answer HTTP 200 on functional failure
    with `ok=false` (craft/build/craft review, pipeline runs). Always check `ok`
    (and `proof.ok` where present). Non-200 codes are protocol-level only:
    401 (auth enabled, token missing/wrong), 429 (rate limit, `Retry-After` set),
    422 (body/params do not match this schema), 400/403/404/500/503 where the
    operation documents them.

    ACCESS GUARD: the launcher installs ONE middleware in front of every mutating
    route — optional token auth (`NEXUS_AUTH_TOKEN`, header `X-Auth-Token`), a
    per-client rate limit (`NEXUS_RATE_LIMIT`/`NEXUS_RATE_WINDOW`, default 120 per
    60s) and an optional JSONL audit log (`NEXUS_AUDIT_LOG`). GET always passes.
    Denied calls return `{ok: false, error: ...}`; 429 also carries `Retry-After`.

    Every path in this file is served by at least one app; the drift guard
    (`tests/test_openapi.py`) fails CI on an undocumented route or a phantom one.
  contact:
    name: tibatechapp-ship-it
    url: https://github.com/tibatechapp-ship-it/nexus-core
servers:
- url: http://127.0.0.1:8000
  description: Local server (binds 127.0.0.1 only)
tags:
- name: System
  description: Health, readiness, stats, metrics, db stats.
- name: Council
  description: Live deliberation, debates, sessions, genome.
- name: Memory
  description: Decision history, conversations, traces, export.
- name: Craft
  description: Brief→code and decision→bundle with compile proofs.
- name: Review
  description: Folder/code review through the live council.
- name: Workspace
  description: File tree, read/write inside the workspace.
- name: Agents
  description: Agent roster and genome reads.
- name: Pipeline
  description: Plan/run the proactive pipeline (SSE for streams).
- name: Security
  description: Security checks and their metrics.
- name: Training
  description: Training runs, lessons and evaluation.
- name: Knowledge
  description: Shared knowledge base documents and search.
- name: Skills
  description: Skill catalogue, reads and user overrides.
- name: Verify
  description: 'Verify-by-execution: run, grade, repair loop.'
- name: Maintenance
  description: Read-only fleet-health metrics over the genome.
- name: Chat
  description: Gateway chat and code analysis.
paths:
  /api/agents:
    x-served-by:
    - nexus_agent.py
    - unified_agent.py
    get:
      tags:
      - Agents
      summary: List Agents
      operationId: getAgents
      x-app: unified_agent.py
      description: List all 52 agents as MCP tools.
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/build:
    x-served-by:
    - main.py
    - nexus_agent.py
    post:
      tags:
      - Craft
      summary: Convert a council decision into a file bundle on disk
      description: |
        Body accepts `decision_id` (build from a stored decision), `query`
        (deliberate then build) and `use_llm` (default true). Functional errors
        return 200 with ok=false.
      operationId: buildFromDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision_id:
                  type: string
                  example: decision_1792021853442372_1
                query:
                  type: string
                use_llm:
                  type: boolean
                  default: true
      responses:
        '200':
          description: result (check ok)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CraftBuildResult'
        '401':
          description: auth is enabled (CRAFT_AUTH_TOKEN and/or the gateway's NEXUS_AUTH_TOKEN) and the
            token header is missing/wrong
        '429':
          description: the gateway rate limit is exhausted (Retry-After header set)
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-app: main.py
      security:
      - AccessToken: []
  /api/builds:
    x-served-by:
    - main.py
    - nexus_agent.py
    get:
      tags:
      - Craft
      summary: List existing builds
      operationId: listBuilds
      parameters:
      - name: n
        in: query
        schema:
          type: integer
          default: 20
        description: how many recent builds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BuildSummary'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-app: main.py
  /api/builds/{build_id}:
    x-served-by:
    - main.py
    - nexus_agent.py
    get:
      tags:
      - Craft
      summary: Build detail (the build manifest)
      operationId: getBuild
      parameters:
      - name: build_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: manifest (or error object)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildManifest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-app: main.py
  /api/chat:
    x-served-by:
    - nexus_agent.py
    - unified_agent.py
    post:
      tags:
      - Chat
      summary: Chat Endpoint
      operationId: postChat
      x-app: unified_agent.py
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gw_contract__ChatRequest'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - AccessToken: []
  /api/council/debate:
    x-served-by:
    - nexus_agent.py
    - unified_agent.py
    post:
      tags:
      - Council
      summary: Council Debate
      operationId: postCouncilDebate
      x-app: unified_agent.py
      description: Run a full council debate and return the synthesised result.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaCouncilRequest'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - AccessToken: []
  /api/council/sessions:
    x-served-by:
    - nexus_agent.py
    - unified_agent.py
    get:
      tags:
      - Council
      summary: Council Sessions
      operationId: getCouncilSessions
      x-app: unified_agent.py
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/council/sessions/{sid}:
    x-served-by:
    - nexus_agent.py
    - unified_agent.py
    delete:
      tags:
      - Council
      summary: Council Session Delete
      operationId: deleteCouncilSessionsSid
      x-app: unified_agent.py
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          title: Sid
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - AccessToken: []
    get:
      tags:
      - Council
      summary: Council Session Get
      operationId: getCouncilSessionsSid
      x-app: unified_agent.py
      parameters:
      - name: sid
        in: path
        required: true
        schema:
          type: string
          title: Sid
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/council/stream:
    x-served-by:
    - nexus_agent.py
    - unified_agent.py
    post:
      tags:
      - Council
      summary: Council Stream
      operationId: postCouncilStream
      x-app: unified_agent.py
      description: Stream a live council debate as Server-Sent Events.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaCouncilRequest'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - AccessToken: []
  /api/craft:
    x-served-by:
    - main.py
    - nexus_agent.py
    post:
      tags:
      - Craft
      summary: Generate code files from a free-text brief (+ optional council review)
      description: |
        Flow: brief -> LLM -> strict JSON array of {path, content} -> safety gate
        (name/extension/depth/size) -> write -> py_compile per .py file.
        proof.ok=false means at least one .py failed to compile — errors are
        reported honestly per file. review runs the council on the generated
        code and returns its verdict. Failures raise inside the module and are
        surfaced as {"ok": false, "error": "..."} with HTTP 200.
      operationId: craftCode
      security:
      - CraftToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  maxLength: 800
                  example: اكتب دالة فيبوناتشي في بايثون مع اختبار بسيط
                review:
                  type: boolean
                  default: false
                  description: run council review on the generated code
      responses:
        '200':
          description: result (check ok and proof.ok)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CraftBuildResult'
              example:
                ok: true
                build_id: craft_1792021853442372
                dir: /home/user/.nexus/data/builds/craft_1792021853442372
                files:
                - path: fib.py
                  bytes: 214
                - path: README.md
                  bytes: 580
                proof:
                  files_written: 2
                  py_compile:
                    fib.py: ok
                  ok: true
                review:
                  verdict: approve
                  score: 0.85
        '401':
          description: auth is enabled (CRAFT_AUTH_TOKEN and/or the gateway's NEXUS_AUTH_TOKEN) and the
            token header is missing/wrong
        '429':
          description: the gateway rate limit is exhausted (Retry-After header set)
      x-app: main.py
      x-raw-body: true
  /api/deliberate:
    x-served-by:
    - main.py
    - nexus_agent.py
    post:
      tags:
      - Council
      summary: Start a live deliberation — Server-Sent Events stream
      description: |
        Returns text/event-stream. Event types:
        - `status`        {phase, message, topic_id?}   phases: init|context|council_start
        - `agent_action`  {actor, phase, text}          one per agent response, streamed live
        - `final_verdict` {verdict, score, rounds, elapsed, consensus, recommendation, record_id}
        - `error`         {message}

        NOTE: use fetch + ReadableStream (the native EventSource API cannot POST).
        An empty query returns plain JSON {"error": "..."} with 200 (not a stream).
      operationId: deliberate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  maxLength: 1000
                  example: هل نستخدم SQLite أم PostgreSQL؟
                question:
                  type: string
                  description: alias accepted for backward compatibility
      responses:
        '200':
          description: SSE stream (or a JSON error object for an empty query)
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: status
                data: {"phase": "init", "message": "جاري تحليل الاستعلام..."}

                event: agent_action
                data: {"actor": "profiler", "phase": "independent", "text": "..."}

                event: final_verdict
                data: {"verdict": "approve", "score": 0.85, "rounds": 0, "elapsed": 3.5, "consensus": true, "recommendation": "SQLite", "record_id": "decision_..."}
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: الاستعلام فارغ
        '401':
          description: auth is enabled (CRAFT_AUTH_TOKEN and/or the gateway's NEXUS_AUTH_TOKEN) and the
            token header is missing/wrong
        '429':
          description: the gateway rate limit is exhausted (Retry-After header set)
      x-app: main.py
      x-raw-body: true
      security:
      - AccessToken: []
  /api/diag:
    x-served-by:
    - nexus_agent.py
    get:
      tags:
      - System
      summary: Api Diag
      operationId: getDiag
      x-app: nexus_agent.py
      description: 'تشخيص فوري للبوابة: أي ملف مشغّل، هل المحرك حيّ، وكم مسار في كل طبقة.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Api Diag Api Diag Get
  /api/exec:
    x-served-by:
    - nexus_agent.py
    post:
      tags:
      - System
      summary: Exec Code
      operationId: postExec
      x-app: nexus_agent.py
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecReq'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - AccessToken: []
  /api/exec/tools:
    x-served-by:
    - nexus_agent.py
    get:
      tags:
      - System
      summary: Exec Tools
      operationId: getExecTools
      x-app: nexus_agent.py
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/genome:
    x-served-by:
    - nexus_agent.py
    - unified_agent.py
    get:
      tags:
      - Agents
      summary: Genome List
      operationId: getGenome
      x-app: unified_agent.py
      description: Every agent's genome, ranked by standing (best first).
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/genome/export:
    x-served-by:
    - nexus_agent.py
    - unified_agent.py
    get:
      tags:
      - Agents
      summary: Genome Export
      operationId: getGenomeExport
      x-app: unified_agent.py
      description: Export the whole genome (agents + timelines) as a downloadable JSON.
      responses:
        '200':
          $ref: '#/components/responses/Ok'
  /api/genome/import:
    x-served-by:
    - nexus_agent.py
    - unified_agent.py
    post:
      tags:
      - Agents
      summary: Genome Import
      operationId: postGenomeImport
      x-app: unified_agent.py
      description: Import agents from an exported genome (idempotent by agent_id).
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - AccessToken: []
  /api/genome/{agent_id}:
    x-served-by:
    - nexus_agent.py
    - unified_agent.py
    get:
      tags:
      - Agents
      summary: Genome Detail
      operationId: getGenomeAgent_id
      x-app: unified_agent.py
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    patch:
      tags:
      - Agents
      summary: Genome Patch
      operationId: patchGenomeAgent_id
      x-app: unified_agent.py
      description: Edit an agent's persona / display name (does not touch its stats).
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenomePatch'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - AccessToken: []
  /api/genome/{agent_id}/reset:
    x-served-by:
    - nexus_agent.py
    - unified_agent.py
    post:
      tags:
      - Agents
      summary: Genome Reset
      operationId: postGenomeAgent_idReset
      x-app: unified_agent.py
      description: 'Re-train an agent: zero its stats, bump generation, keep lineage.'
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      security:
      - AccessToken: []
  /api/health:
    x-served-by:
    - main.py
    - nexus_agent.py
    - unified_agent.py
    get:
      tags:
      - System
      summary: Service health, version, component status
      operationId: getHealth
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                version: 1.46.0
                status: ok
                service: nexus-core
                uptime_seconds: 42.5
                bridge: true
                topics: true
                builder: true
                builder_error: null
                embeddings: hashing
                embeddings_requested: null
                embeddings_fallback: null
                bridge_error: null
      x-app: main.py
  /api/history:
    x-served-by:
    - main.py
    - nexus_agent.py
    get:
      tags:
      - Memory
      summary: Recent decisions (server-side text filter available)
      operationId: listHistory
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: substring filter on query/reasoning/topic_id/category
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: 'list (or {"error", "items": []} on storage failure)'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryItem'
              example:
              - id: decision_1792024508871482_1
                query: هل نستخدم sqlite؟
                verdict: approve
                score: 0.85
                topic_id: ''
                timestamp: 1792024508.87
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-app: main.py
  /api/history/{rec_id}:
    x-served-by:
    - main.py
    - nexus_agent.py
    get:
      tags:
      - Memory
      summary: Full decision record incl. transcript
      operationId: getDecision
      parameters:
      - name: rec_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 'full record (or {"error": "not found"})'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      x-app: main.py
  /api/mcp/tools:
    x-served-by:
    - nexus_agent.py
    get:
      tags:
      - Agents
      summary: Api Mcp Tools
      operationId: getMcpTools
      x-app: nexus_agent.py
      description: 'أدوات خادم MCP لسطح الإطار: الاسم، الوصف، والمجموعة، ومخطّط الإدخال.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Api Mcp Tools Api Mcp Tools Get
  /api/monitoring/clear:
    x-served-by:
    - nexus_agent.py
    post:
      tags:
      - System
      summary: Api Metrics Clear
      operationId: postMonitoringClear
      x-app: nexus_agent.py
      description: يحذف سجلّ اليوم ويعيد عدد الاستدعاءات المحذوفة.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Api Metrics Clear Api Monitoring Clear Post
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      security:
      - AccessToken: []
  /api/monitoring/session:
    x-served-by:
    - nexus_agent.py
    get:
      tags:
      - System
      summary: Api Metrics Session
      operationId: getMonitoringSession
      x-app: nexus_agent.py
      description: إحصاء استدعاءات هذه الجلسة (في الذاكرة، بلا ملفّ).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Api Metrics Session Api Monitoring Session Get
  /api/monitoring/today:
    x-served-by:
    - nexus_agent.py
    get:
      tags:
      - System
      summary: Api Metrics Today
      operationId: getMonitoringToday
      x-app: nexus_agent.py
      description: إحصاء استدعاءات LLM المُسجَّلة اليوم (يُقرأ من ملفّ المراقبة).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Api Metrics Today Api Monitoring Today Get
  /api/orchestrator/execute:
    x-served-by:
    - nexus_agent.py
    post:
      tags:
      - System
      summary: ' Orchestrator Execute'
      operationId: postOrchestratorExecute
      x-app: nexus_agent.py
      description: |-
        صنّف + اختر وكيلاً + نفّذ + بوابة هيئة للخطر العالي (v1.22.0).

        مخرَج ``Orchestrator.execute``: ``{plan, jury, output, ok}``. بوابة الهيئة
        تعمل الآن مع الموجّه الحقيقي عبر ``RouterLLMAdapter`` (تحويل dict→نصّ + معالجة
        ``json_mode`` الناقص) — وإلا فإن كل عمل عالي الخطورة يُرفض بخطأ نوع.
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
