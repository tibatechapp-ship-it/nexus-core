components:
  securitySchemes:
    CraftToken:
      type: apiKey
      in: header
      name: X-Craft-Token
      description: Required only when CRAFT_AUTH_TOKEN is set (workbench).
    AccessToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Required on mutating methods only when the gateway runs with NEXUS_AUTH_TOKEN set.
  schemas:
    Health:
      type: object
      required:
      - status
      - version
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          description: pyproject.toml [project].version (single source)
        service:
          type: string
          example: nexus-core
        uptime_seconds:
          type: number
          description: Seconds since this process started
        bridge:
          type: boolean
        topics:
          type: boolean
        builder:
          type: boolean
        builder_error:
          type: string
          nullable: true
        embeddings:
          type: string
          nullable: true
          example: hashing
        embeddings_requested:
          type: string
          nullable: true
        embeddings_fallback:
          type: string
          nullable: true
        bridge_error:
          type: string
          nullable: true
    Readiness:
      type: object
      required:
      - ready
      - status
      - checks
      properties:
        ready:
          type: boolean
        status:
          type: string
          enum:
          - ready
          - not_ready
          - error
        version:
          type: string
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ReadinessCheck'
    ReadinessCheck:
      type: object
      required:
      - name
      - ok
      properties:
        name:
          type: string
          enum:
          - postgres
          - redis
        target:
          type: string
          example: postgres:5432
        ok:
          type: boolean
        mode:
          type: string
          enum:
          - driver
          - tcp
          description: driver = protocol probe, tcp = connect-only fallback
        detail:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        latency_ms:
          type: number
    HistoryItem:
      type: object
      description: Brief row returned by /api/history and /api/history?q=
      properties:
        id:
          type: string
        query:
          type: string
          description: truncated to ~100 chars
        verdict:
          type: string
          enum:
          - approve
          - reject
          - human_review
          - unknown
        score:
          type: number
        topic_id:
          type: string
        timestamp:
          type: number
          description: unix seconds
    Decision:
      type: object
      properties:
        id:
          type: string
        query:
          type: string
        verdict:
          type: string
        score:
          type: number
        rounds:
          type: integer
        consensus:
          type: boolean
        reasoning:
          type: string
        transcript:
          type: array
          items:
            type: object
            properties:
              phase:
                type: string
                example: debate_1
              member:
                type: string
                example: critic
              response:
                type: string
        topic_id:
          type: string
        category:
          type: string
        security_events:
          type: array
          items:
            type: object
        timestamp:
          type: number
    Stats:
      type: object
      properties:
        total:
          type: integer
        by_verdict:
          type: object
          properties:
            approve:
              type: integer
            reject:
              type: integer
            human_review:
              type: integer
        avg_score:
          type: number
        avg_rounds:
          type: number
    Topic:
      type: object
      properties:
        id:
          type: string
          example: db_sqlite_vs_postgres
        title:
          type: string
        category:
          type: string
        question:
          type: string
        risk:
          type: string
          example: low
    CraftBuildResult:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
        error:
          type: string
          description: present only when ok=false
        build_id:
          type: string
        title:
          type: string
          description: present on /api/build
        kind:
          type: string
          enum:
          - code
          - plan
          description: present on /api/build
        summary:
          type: string
          description: present on /api/build
        dir:
          type: string
          description: absolute path of the build folder
        files:
          type: array
          items:
            type: object
            required:
            - path
            - bytes
            properties:
              path:
                type: string
              bytes:
                type: integer
        proof:
          type: object
          properties:
            files_written:
              type: integer
            ok:
              type: boolean
            py_compile:
              type: object
              description: path -> "ok" | compile error message (.py files only)
              additionalProperties:
                type: string
        review:
          nullable: true
          description: null when review=false or generation failed
          type: object
          properties:
            verdict:
              type: string
              enum:
              - approve
              - reject
              - human_review
              - error
            score:
              type: number
            error:
              type: string
              description: present when the review call failed
    ReviewResult:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
        error:
          type: string
          description: present only when ok=false
        project:
          type: string
          description: reviewed folder name
        files_reviewed:
          type: integer
        bytes_reviewed:
          type: integer
        verdict:
          type: string
          nullable: true
        score:
          type: number
          nullable: true
        recommendation:
          type: string
          nullable: true
        transcript:
          type: array
          items:
            type: object
    BuildSummary:
      type: object
      properties:
        build_id:
          type: string
        title:
          type: string
        kind:
          type: string
        ok:
          type: boolean
        files:
          type: integer
          description: file count
        timestamp:
          type: number
    BuildManifest:
      type: object
      properties:
        build_id:
          type: string
        title:
          type: string
        kind:
          type: string
        summary:
          type: string
        steps:
          type: array
          items:
            type: string
        verdict:
          type: string
        files:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              bytes:
                type: integer
              sha256:
                type: string
        skipped:
          type: array
          items:
            type: string
        proof:
          type: object
        timestamp:
          type: number
    ValidationError:
      type: object
      required:
      - detail
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
    AnalyzeRequest:
      properties:
        task:
          type: string
          title: Task
          default: security_audit
        code:
          type: string
          title: Code
      type: object
      required:
      - code
      title: AnalyzeRequest
    BatchTrainRequest:
      properties:
        agent_ids:
          items:
            type: string
          type: array
          maxItems: 200
          title: Agent Ids
        spec:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Spec
        quality:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Quality
          default: 0.85
        salt:
          type: string
          maxLength: 64
          title: Salt
          default: ''
      type: object
      title: BatchTrainRequest
      description: Body of ``POST /api/training/batch``.
    ConversationCreate:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        title:
          type: string
          title: Title
          default: ''
        agent:
          type: string
          title: Agent
          default: ''
      type: object
      title: ConversationCreate
    ConversationPut:
      properties:
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        agent:
          anyOf:
          - type: string
