<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212121">
<title>NovaMind Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2310a37f'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='sans-serif'>N</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<style>
:root{
  --bg:#212121; --sidebar:#171717; --panel:#1b1b1b; --user:#2f2f2f;
  --text:#ececec; --dim:#a8a8a8; --faint:#7d7d7d;
  --accent:#10a37f; --accent2:#58a6ff; --line:#3a3a3a; --border:#444;
  --hover:#262626; --danger:#ef4444; --ok:#22c55e;
  --r:12px; --r-sm:8px; --side-w:260px; --info-w:300px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.65;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#3d3d3d;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#4d4d4d}
::-webkit-scrollbar-track{background:transparent}

/* ---------- App shell: sidebar LEFT, info RIGHT (physical) ---------- */
.app{display:grid;grid-template-columns:var(--side-w) 1fr var(--info-w);
  height:100vh;height:100dvh;direction:ltr}
.app>*{direction:rtl}
.app.no-info{grid-template-columns:var(--side-w) 1fr}

/* ---------- Sidebar ---------- */
.sidebar{background:var(--sidebar);display:flex;flex-direction:column;
  min-width:0;border-inline-end:1px solid #000;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;font-weight:700;font-size:16px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);
  display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.side-pad{padding:8px 12px}
.btn-new{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;
  border:1px solid var(--border);border-radius:var(--r);color:var(--text);
  background:transparent;transition:background .15s,border-color .15s}
.btn-new:hover{background:var(--hover);border-color:#5a5a5a}
.conv-list{flex:1;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:2px}
.conv{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--r-sm);
  cursor:pointer;transition:background .12s}
.conv:hover{background:var(--hover)}
.conv.active{background:#2b2b2b}
.conv .meta{flex:1;min-width:0}
.conv .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.conv .date{font-size:11px;color:var(--faint);margin-top:2px}
.conv .del{opacity:0;color:var(--faint);padding:4px;border-radius:6px;flex:none}
.conv:hover .del{opacity:1}
.conv .del:hover{color:var(--danger);background:#3a2020}
.side-foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.side-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--r-sm);
  width:100%;transition:background .12s;font-size:14px}
.side-row:hover{background:var(--hover)}
.side-row .sp{flex:1;text-align:start}
.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);padding:4px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--danger)}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:10px;
  padding:0 14px;border-bottom:1px solid var(--line)}
.icon-btn{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;
  color:var(--dim);transition:background .12s,color .12s;flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.agent-pick{display:flex;align-items:center;gap:8px;background:var(--hover);
  border:1px solid var(--line);border-radius:10px;padding:6px 10px;max-width:280px}
.agent-pick select{background:transparent;border:none;color:var(--text);font:inherit;
  max-width:220px;cursor:pointer;outline:none}
.agent-pick select option{background:#2a2a2a;color:var(--text)}
.topbar .grow{flex:1}
.avatar-me{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#10a37f,#0d8a6c);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}

/* ---------- Messages ---------- */
.messages{flex:1;overflow-y:auto;padding:22px 0 8px;direction:ltr}
.msg{display:flex;gap:14px;align-items:flex-start;width:100%;
  max-width:820px;margin:0 auto 22px;padding:0 20px}
.msg.assistant{justify-content:flex-start}
.msg.user{justify-content:flex-end;flex-direction:row-reverse}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:13px;font-weight:700;margin-top:2px}
.av.ai{background:var(--accent);color:#fff}
.av.me{background:#3a3a3a;color:#ddd}
.bubble-wrap{max-width:min(74%,640px);min-width:0}
.bubble{direction:rtl;padding:11px 15px;border-radius:14px;overflow-wrap:anywhere}
.msg.user .bubble{background:var(--user);border-start-end-radius:4px}
.msg.assistant .bubble{background:transparent;padding:2px 4px;border-start-start-radius:4px}
.bubble.streaming{white-space:pre-wrap}
.bubble p{margin:0 0 10px}.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{margin:14px 0 8px;line-height:1.3}
.bubble h1{font-size:1.4em}.bubble h2{font-size:1.22em}.bubble h3{font-size:1.08em}
.bubble ul,.bubble ol{margin:6px 0 10px;padding-inline-start:22px}
.bubble li{margin:3px 0}
.bubble a{color:var(--accent2);text-decoration:underline;text-underline-offset:3px}
.bubble blockquote{border-inline-start:3px solid var(--accent);margin:8px 0;padding:2px 12px;color:var(--dim)}
.bubble hr{border:none;border-top:1px solid var(--line);margin:14px 0}
.bubble code.ic{background:#2b2b2b;border:1px solid var(--line);border-radius:5px;padding:1px 5px;
  font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:.88em;direction:ltr;display:inline-block}
.code{margin:10px 0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;direction:ltr}
.code-head{display:flex;align-items:center;justify-content:space-between;background:#161616;
  padding:5px 10px;font-size:12px;color:var(--dim);direction:ltr}
.code-head button{color:var(--dim);padding:3px 8px;border-radius:6px}
.code-head button:hover{color:var(--text);background:#2a2a2a}
.code pre{margin:0;overflow-x:auto;background:#0f0f0f}
.code pre code{display:block;padding:12px 14px;font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;
  font-size:13px;line-height:1.55;direction:ltr;text-align:left}
.msg-actions{display:flex;gap:4px;margin-top:6px;opacity:0;transition:opacity .15s;height:26px}
.msg:hover .msg-actions{opacity:1}
.msg.user .msg-actions{justify-content:flex-end}
.act{width:28px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--faint)}
.act:hover{background:var(--hover);color:var(--text)}
.bubble.edit textarea{width:min(70vw,560px);min-height:70px;background:#1a1a1a;color:var(--text);
  border:1px solid var(--accent);border-radius:8px;padding:8px 10px;font:inherit;resize:vertical}
.edit-row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.pill{padding:6px 14px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px}
.pill.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}

/* typing indicator */
.typing{display:flex;gap:5px;padding:6px 2px;align-items:center}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--dim);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ---------- Composer ---------- */
.composer{flex:none;padding:8px 16px 16px;direction:rtl}
.composer-in{max-width:820px;margin:0 auto;background:#2a2a2a;border:1px solid var(--line);
  border-radius:18px;padding:10px 10px 8px 12px;display:flex;align-items:flex-end;gap:8px;
  transition:border-color .15s}
.composer-in:focus-within{border-color:#555}
#input{flex:1;background:transparent;border:none;outline:none;color:var(--text);
  font:inherit;resize:none;max-height:200px;line-height:1.6;padding:6px 4px}
#input::placeholder{color:var(--faint)}
.send{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;flex:none;transition:transform .12s,opacity .12s}
.send:hover{transform:translateY(-1px)}
.send:disabled{background:#4a4a4a;opacity:.6;cursor:not-allowed;transform:none}
.send.stop{background:#d64545}
.composer-foot{max-width:820px;margin:6px auto 0;display:flex;justify-content:space-between;
  font-size:11px;color:var(--faint);padding:0 6px}
kbd{background:#333;border:1px solid #4a4a4a;border-radius:4px;padding:0 5px;font-size:10px}

/* ---------- Info panel ---------- */
.info{background:var(--panel);border-inline-start:1px solid #000;overflow-y:auto;z-index:38}
.info h3{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:18px 16px 8px}
.info .card{margin:0 14px 10px;background:#242424;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.info .agent-name{font-weight:700;display:flex;align-items:center;gap:8px}
.info .desc{color:var(--dim);font-size:13px;margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:0 14px}
.tool{background:#242424;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--dim)}
.stat{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.stat:last-child{border:none}.stat b{color:var(--text);font-weight:600}
.switch{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.tgl{width:40px;height:22px;border-radius:20px;background:#444;position:relative;transition:background .15s;flex:none}
.tgl.on{background:var(--accent)}
.tgl::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:transform .15s}
.tgl.on::after{transform:translateX(-18px)}

/* ---------- Overlays / modal / toasts ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45;display:none}
.backdrop.show{display:block}
.modal{position:fixed;z-index:60;inset-inline:0;top:12vh;margin:auto;width:min(92vw,520px);
  background:#242424;border:1px solid var(--border);border-radius:16px;padding:16px;display:none}
.modal.show{display:block}
.modal h2{margin:0 0 12px;font-size:17px}
.modal input.search{width:100%;padding:11px 13px;border-radius:10px;background:#1a1a1a;
  border:1px solid var(--border);color:var(--text);font:inherit;outline:none;margin-bottom:10px}
.result{padding:10px;border-radius:9px;cursor:pointer}.result:hover{background:var(--hover)}
.result .d{font-size:11px;color:var(--faint)}
.modal.wide{width:min(94vw,720px);max-height:84vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.trace-item{padding:10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.trace-item:hover{background:var(--hover)}
.trace-item.sel{border-color:var(--accent);background:var(--hover)}
.trace-item .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trace-item .d{font-size:11px;color:var(--faint);margin-top:3px}
.trace-detail{margin-top:12px;border-top:1px solid var(--border);padding-top:12px;display:none}
.trace-detail.show{display:block}
.trace-detail h4{margin:10px 0 4px;font-size:13px;color:var(--faint)}
.trace-detail pre{white-space:pre-wrap;word-break:break-word;background:#1a1a1a;border:1px solid var(--border);
  border-radius:9px;padding:10px;font-size:12px;max-height:30vh;overflow:auto;margin:0 0 6px}
.trace-detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.trace-meta{font-size:11px;color:var(--faint)}
.toasts{position:fixed;bottom:20px;inset-inline-start:20px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{background:#2f2f2f;border:1px solid var(--border);border-inline-start:3px solid var(--accent);
  padding:10px 16px;border-radius:10px;font-size:14px;animation:slide .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.err{border-inline-start-color:var(--danger)}
@keyframes slide{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

.menu-btn{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .menu-btn{display:grid}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:280px;transform:translateX(-100%);
    transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .sidebar.open{transform:translateX(0)}
  .info{position:fixed;top:0;bottom:0;right:0;width:300px;transform:translateX(100%);
    transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .info.open{transform:translateX(0)}
  .msg{padding:0 12px}.bubble-wrap{max-width:82%}
  .agent-pick{max-width:150px}.agent-pick select{max-width:96px}
}
@media (max-width:520px){.agent-pick{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">N</span><span>NovaMind</span></div>
    <div class="side-pad">
      <button class="btn-new" id="btnNew">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="newChat">محادثة جديدة</span>
      </button>
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="side-foot">
      <button class="side-row" id="btnSettings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="sp" data-i18n="settings">الإعدادات</span>
      </button>
      <button class="side-row" id="btnLang">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/></svg>
        <span class="sp" data-i18n="language">اللغة</span>
        <b id="langTag">AR</b>
      </button>
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText" data-i18n="online">متصل</span></div>
    </div>
  </aside>

  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="btnMenu" aria-label="menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="agent-pick">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10zM4 22a8 8 0 0 1 16 0"/></svg>
        <select id="agentSelect" aria-label="agent"></select>
      </div>
      <div class="grow"></div>
      <button class="icon-btn" id="btnTopNew" aria-label="new">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="btnTraces" aria-label="time machine" title="Time Machine">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="icon-btn" id="btnSearch" aria-label="search">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="icon-btn" id="btnInfo" aria-label="info">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-5M12 8h.01"/></svg>
      </button>
      <div class="avatar-me">أ</div>
    </header>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <div class="composer-in">
        <textarea id="input" rows="1" placeholder="اكتب رسالتك…" data-i18n-ph="placeholder"></textarea>
        <button class="send" id="btnSend" aria-label="send" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
      <div class="composer-foot">
        <span><kbd>Enter</kbd> <span data-i18n="enterSend">للإرسال</span> · <kbd>Shift</kbd>+<kbd>Enter</kbd> <span data-i18n="shiftNewline">سطر جديد</span></span>
        <span id="charCount">0</span>
      </div>
    </div>
  </main>

  <aside class="info" id="info">
    <h3 data-i18n="curAgent">الوكيل الحالي</h3>
    <div class="card">
      <div class="agent-name"><span class="dot" style="background:var(--accent)"></span><span id="infoAgent">—</span></div>
      <div class="desc" id="infoAgentDesc">—</div>
    </div>
    <h3 data-i18n="tools">الأدوات المتاحة</h3>
    <div class="tools" id="infoTools"></div>
    <h3 data-i18n="stats">إحصائيات</h3>
    <div class="card">
      <div class="stat"><span data-i18n="msgCount">عدد الرسائل</span><b id="stMsg">0</b></div>
      <div class="stat"><span data-i18n="lastUpdate">آخر تحديث</span><b id="stTime">—</b></div>
      <div class="stat"><span data-i18n="conn">حالة الاتصال</span><b id="stConn">—</b></div>
    </div>
    <h3 data-i18n="quick">إعدادات سريعة</h3>
    <div class="card">
      <div class="switch"><span data-i18n="streaming">البث المباشر</span><span class="tgl on" id="tglStream"></span></div>
      <div class="switch"><span data-i18n="showInfo">إظهار لوحة المعلومات</span><span class="tgl on" id="tglInfo"></span></div>
    </div>
    <div style="height:20px"></div>
  </aside>
</div>

<!-- Search modal -->
<div class="modal" id="searchModal">
  <h2 data-i18n="searchTitle">بحث في المحادثات</h2>
  <input class="search" id="searchInput" placeholder="🔎 …" autocomplete="off">
  <div id="searchResults" style="max-height:44vh;overflow:auto"></div>
</div>

<!-- Settings modal -->
<div class="modal" id="settingsModal">
  <h2 data-i18n="settings">الإعدادات</h2>
  <div class="switch"><span data-i18n="language">اللغة</span>
    <button class="pill ghost" id="setLang">AR / EN</button></div>
  <div class="switch"><span data-i18n="showInfo">إظهار لوحة المعلومات</span><span class="tgl on" id="setInfo"></span></div>
  <div class="switch"><span data-i18n="confirmClear">حذف كل المحادثات</span>
    <button class="pill" id="setClear" style="background:var(--danger)">🗑</button></div>
  <div style="margin-top:14px;text-align:end">
    <button class="pill ghost" id="setClose" data-i18n="close">إغلاق</button>
  </div>
</div>

<!-- Time Machine modal -->

<script>

/* ============================ i18n ============================ */

    err:"Connection error ❌",you:"You",assistant:"NovaMind",regen:"Regenerate",edit:"Edit",save:"Save",cancel:"Cancel",

const API={chat:"/api/chat",agents:"/api/agents",convs:"/api/conversations",traces:"/api/traces"};
const LS={conv:"nm_convs",cur:"nm_cur",lang:"nm_lang",migrated:"nm_migrated"};
const MAX_CONV=200;
let useDB=true;              // false = localStorage fallback (API unreachable)
let codes=[];               // highlighted code blocks (per render, kept for copy)

/* ============================ state ============================ */
let state={convs:[],cur:null,lang:"ar",agents:[],agent:"",streaming:false,ctrl:null,stream:true,curTrace:null};
const $=id=>document.getElementById(id);
const t=k=>(I18N[state.lang]||I18N.ar)[k]||k;

/* ============================ storage ============================ */
/* ============================ storage (DB-first) ============================ */
async function apiGet(p){const r=await fetch(p);if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}
async function apiSend(method,p,body){
  try{const r=await fetch(p,{method,headers:{"Content-Type":"application/json"},
    body:body?JSON.stringify(body):undefined});
    return r.ok?await r.json():null;}catch(e){return null;}
}
// push the whole thread to SQLite (client-authoritative sync). Never wipes messages
// that aren't loaded yet.
function saveConv(c){
  if(!useDB||!c)return;
  const body={title:c.title,agent:c.agent||""};
  if(c.messages)body.messages=c.messages.map(m=>({role:m.role,content:m.content,ts:m.ts||Date.now()}));
  apiSend("PUT",API.convs+"/"+c.id,body);
}
function saveCache(){  // localStorage mirror → offline fallback
  try{localStorage.setItem(LS.conv,JSON.stringify(state.convs.slice(0,MAX_CONV)));}catch(e){}
  localStorage.setItem(LS.cur,state.cur||"");
  localStorage.setItem(LS.lang,state.lang);
}
function save(){saveCache();const c=curConv();if(c)saveConv(c);}
async function load(){
  state.lang=localStorage.getItem(LS.lang)||"ar";
  let cached=[];try{cached=JSON.parse(localStorage.getItem(LS.conv)||"[]")}catch(e){cached=[]}
  try{
    let j=await apiGet(API.convs);state.convs=j.conversations||[];useDB=true;
    if(!localStorage.getItem(LS.migrated)){
      if(Array.isArray(cached)&&cached.length){
        await apiSend("POST",API.convs+"/migrate",{conversations:cached});
        j=await apiGet(API.convs);state.convs=j.conversations||[];
      }
      localStorage.setItem(LS.migrated,"1");
    }
  }catch(e){
    useDB=false;state.convs=Array.isArray(cached)?cached:[];
  }
  state.cur=localStorage.getItem(LS.cur)||null;
  if(!Array.isArray(state.convs))state.convs=[];
}
// list endpoint omits messages → hydrate the selected conversation on demand
async function ensureMessages(c){
  if(!c||c.messages)return;
  if(!useDB){c.messages=c.messages||[];return;}
  try{const d=await apiGet(API.convs+"/"+c.id);c.messages=d.messages||[];c.message_count=(d.messages||[]).length;}
  catch(e){c.messages=c.messages||[];}
}
const curConv=()=>state.convs.find(c=>c.id===state.cur);
async function newChat(){
  const c={id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    title:t("empty"),messages:[],agent:state.agent,date:Date.now(),message_count:0};
  state.convs.unshift(c);state.cur=c.id;saveConv(c);saveCache();
  renderSidebar();await renderMessages();renderInfo();closeAll();
  $("input").focus();return c;
}

/* ============================ time / helpers ============================ */
function fmt(ts){const d=new Date(ts);
  return d.toLocaleDateString(state.lang==="ar"?"ar-EG":"en-US",{month:"short",day:"numeric"})+", "+
    d.toLocaleTimeString(state.lang==="ar"?"ar-EG":"en-US",{hour:"2-digit",minute:"2-digit"});}

/* ============================ markdown ============================ */
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function inline(s){
  s=s.replace(/`([^`]+)`/g,"<code class=\"ic\">$1</code>");
  s=s.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,"$1<em>$2</em>");
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(src){
  src=String(src==null?"":src);
  const lines=src.split("\n");const out=[];let i=0;
  codes=[];
  const isBlank=l=>/^\s*$/.test(l);
  while(i<lines.length){
    const line=lines[i];
    let m;
    if(m=line.match(/^\s*```(\w+)?\s*$/)){
      const lang=m[1]||"";i++;const buf=[];
      while(i<lines.length&&!/^\s*```\s*$/.test(lines[i])){buf.push(lines[i]);i++;}
      i++;const raw=buf.join("\n");const idx=codes.push({lang,raw})-1;
      out.push("@@C"+idx+"@@");continue;
    }
    if(isBlank(line)){i++;continue;}
    if(m=line.match(/^(#{1,6})\s+(.*)$/)){const n=m[1].length;out.push("<h"+n+">"+inline(esc(m[2]))+"</h"+n+">");i++;continue;}
    if(/^\s*[-*+]\s+/.test(line)){out.push("<ul>");
      while(i<lines.length&&/^\s*[-*+]\s+/.test(lines[i])){out.push("<li>"+inline(esc(lines[i].replace(/^\s*[-*+]\s+/,"")))+"</li>");i++;}out.push("</ul>");continue;}
    if(/^\s*\d+[.)]\s+/.test(line)){out.push("<ol>");
      while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){out.push("<li>"+inline(esc(lines[i].replace(/^\s*\d+[.)]\s+/,"")))+"</li>");i++;}out.push("</ol>");continue;}
    if(/^\s*>\s?/.test(line)){out.push("<blockquote>"+inline(esc(line.replace(/^\s*>\s?/,"")))+"</blockquote>");i++;continue;}
    if(/^\s*---+\s*$/.test(line)){out.push("<hr>");i++;continue;}
    const p=[];
    while(i<lines.length&&!isBlank(lines[i])&&!/^\s*```/.test(lines[i])&&!/^#{1,6}\s/.test(lines[i])
      &&!/^\s*[-*+]\s+/.test(lines[i])&&!/^\s*\d+[.)]\s+/.test(lines[i])&&!/^\s*>/.test(lines[i])&&!/^\s*---+\s*$/.test(lines[i])){
      p.push(lines[i]);i++;}
    out.push("<p>"+inline(esc(p.join("\n"))).replace(/\n/g,"<br>")+"</p>");
  }
  return out.join("\n").replace(/@@C(\d+)@@/g,(_,k)=>{
    const c=codes[+k];
    return '<div class="code"><div class="code-head"><span>'+(c.lang||"code")+
      '</span><button class="code-copy" data-idx="'+k+'">'+t("copy")+'</button></div>'+
      '<pre><code class="hljs'+(c.lang?" language-"+c.lang:"")+'">'+esc(c.raw)+'</code></pre></div>';
  });
}

/* ============================ render: sidebar ============================ */
function renderSidebar(){
  const box=$("convList");box.innerHTML="";
  if(!state.convs.length){box.innerHTML='<div style="color:var(--faint);text-align:center;padding:24px 8px;font-size:13px">'+t("empty")+'</div>';return;}
  state.convs.forEach(c=>{
    const el=document.createElement("div");
    el.className="conv"+(c.id===state.cur?" active":"");
    el.innerHTML='<div class="meta"><div class="title"></div><div class="date"></div></div>'+
      '<button class="del" title="'+t("del")+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>';
    el.querySelector(".title").textContent=c.title||t("empty");
    el.querySelector(".date").textContent=fmt(c.date||Date.now());
    el.onclick=e=>{if(e.target.closest(".del"))return;state.cur=c.id;save();
      renderSidebar();renderMessages();renderInfo();closeAll();};
    el.querySelector(".del").onclick=()=>{if(confirm(t("deleteQ"))){
      if(useDB)apiSend("DELETE",API.convs+"/"+c.id);
      state.convs=state.convs.filter(x=>x.id!==c.id);
      if(state.cur===c.id)state.cur=state.convs[0]?state.convs[0].id:null;
      saveCache();renderSidebar();renderMessages();renderInfo();toast(t("del"));}};
    box.appendChild(el);
  });
}

/* ============================ render: messages ============================ */
function bubbleHTML(role,content,streaming){
  if(role==="assistant")return streaming?esc(content):md(content);
  return esc(content).replace(/\n/g,"<br>");
}
function msgNode(m,idx){
  const row=document.createElement("div");
  row.className="msg "+(m.role==="user"?"user":"assistant");
  const av=document.createElement("div");
  av.className="av "+(m.role==="user"?"me":"ai");
  av.textContent=m.role==="user"?"أ":"N";
  const wrap=document.createElement("div");wrap.className="bubble-wrap";
  const b=document.createElement("div");b.className="bubble"+(m.streaming?" streaming":"");
  b.innerHTML=bubbleHTML(m.role,m.content,m.streaming);
  wrap.appendChild(b);
  // actions
  const acts=document.createElement("div");acts.className="msg-actions";
  if(m.role==="user"){
    acts.innerHTML=btn("copy","<path d='M9 9h10v10H9z'/><path d='M5 15V5h10'/>")+
                   btn("edit","<path d='M12 20h9'/><path d='M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z'/>");
  }else{
    acts.innerHTML=btn("copy","<path d='M9 9h10v10H9z'/><path d='M5 15V5h10'/>")+
                   btn("regen","<path d='M23 4v6h-6M1 20v-6h6'/><path d='M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15'/>");
  }
  acts.querySelectorAll("button").forEach(btnEl=>{
    btnEl.onclick=()=>handleAction(btnEl.dataset.k,idx);
  });
  wrap.appendChild(acts);
  row.appendChild(av);row.appendChild(wrap);
  return row;
}
function btn(k,path){return '<button class="act" data-k="'+k+'" title="'+t(k)+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+path+'</svg></button>';}
async function renderMessages(){
  const box=$("messages");box.innerHTML="";codes=[];
  const c=curConv();
  if(c)await ensureMessages(c);
  if(!c||!(c.messages||[]).length){
    box.innerHTML='<div style="max-width:820px;margin:14vh auto;text-align:center;color:var(--faint)">'+
      '<div style="font-size:44px;margin-bottom:12px">✨</div>'+t("empty")+'</div>';return;
  }
  c.messages.forEach((m,idx)=>box.appendChild(msgNode(m,idx)));
  highlightAll();scrollDown(true);
}
function highlightAll(){
  if(!window.hljs)return;
  $("messages").querySelectorAll("pre code").forEach(el=>{try{hljs.highlightElement(el)}catch(e){}});
}
function scrollDown(force){
  const box=$("messages");
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  if(force||near)box.scrollTop=box.scrollHeight;
}

/* ============================ actions ============================ */
function handleAction(k,idx){
  const c=curConv();if(!c)return;
  const m=c.messages[idx];
  if(k==="copy"){navigator.clipboard.writeText(m.content).then(()=>toast(t("copied"))).catch(()=>toast(t("err"),1));}
  else if(k==="regen"){regenerate(idx);}
  else if(k==="edit"){editMessage(idx);}
}
function editMessage(idx){
  const c=curConv();const m=c.messages[idx];
  const row=$("messages").children[idx];const b=row.querySelector(".bubble");
  b.classList.add("edit");
  b.innerHTML='<textarea>'+esc(m.content)+'</textarea><div class="edit-row">'+
    '<button class="pill ghost" data-c>'+t("cancel")+'</button><button class="pill" data-s>'+t("save")+'</button></div>';
  const ta=b.querySelector("textarea");ta.focus();
  b.querySelector("[data-c]").onclick=()=>renderMessages();
  b.querySelector("[data-s]").onclick=()=>{
    const v=ta.value.trim();if(!v)return;
    c.messages=c.messages.slice(0,idx+1);c.messages[idx].content=v;
    if(idx===0)c.title=v.slice(0,42);
    save();renderMessages();renderSidebar();streamReply(c);
  };
}
function regenerate(idx){
  const c=curConv();
  let ui=idx;while(ui>=0&&c.messages[ui].role!=="user")ui--;
  if(ui<0)return;
  const text=c.messages[ui].content;
  c.messages=c.messages.slice(0,ui+1);
  save();renderMessages();streamReply(c,text);
}

/* ============================ send ============================ */
function pushUser(c,text){
  c.messages.push({role:"user",content:text,ts:Date.now()});
  if(!c.title||c.title===t("empty")||c.title==="محادثة جديدة"||c.title==="New chat")c.title=text.slice(0,42);
  c.date=Date.now();save();
}
function send(){
  if(state.streaming)return;
  const box=$("input");const text=box.value.trim();if(!text)return;
  let c=curConv();if(!c)c=newChat();
  box.value="";autoGrow();$("charCount").textContent="0";
  pushUser(c,text);renderSidebar();renderMessages();
  streamReply(c,text);
}
async function streamReply(c,text){
  const last=text||(c.messages.filter(m=>m.role==="user").slice(-1)[0]||{}).content||"";
  const am={role:"assistant",content:"",streaming:true};
  c.messages.push(am);state.streaming=true;renderMessages();setBusy(true);
  // typing indicator
  const box=$("messages");
  const typing=document.createElement("div");typing.className="msg assistant";
  typing.innerHTML='<div class="av ai">N</div><div class="bubble-wrap"><div class="typing"><i></i><i></i><i></i></div></div>';
  box.appendChild(typing);scrollDown(true);
  const done=()=>{am.streaming=false;state.streaming=false;setBusy(false);typing.remove();
    c.date=Date.now();save();renderMessages();renderInfo();setTimeout(scrollDown,30);};
  let acc="";
  try{
    state.ctrl=new AbortController();
    const res=await fetch(API.chat,{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:last,thread_id:c.id,conversation_id:c.id,agent:state.agent}),
      signal:state.ctrl.signal});
    if(!res.ok)throw new Error("HTTP "+res.status);
    if(!res.body||!state.stream){                 // no stream support → text
      am.content=await res.text();am.streaming=false;renderMessages();done();return;
    }
    const reader=res.body.getReader();const dec=new TextDecoder();let buf="";
    while(true){
      const r=await reader.read();if(r.done)break;
      buf+=dec.decode(r.value,{stream:true});
      let sep;
      while((sep=buf.indexOf("\n\n"))>=0){
        const raw=buf.slice(0,sep);buf=buf.slice(sep+2);
        const ev=raw.split("\n").find(l=>l.startsWith("data:"));
        if(!ev)continue;
        const data=ev.slice(5).trim();
        if(data==="[DONE]")continue;
        let o;try{o=JSON.parse(data)}catch(e){continue;}
        if(o.type==="chunk"){acc+=o.content;
          const rows=box.querySelectorAll(".msg");const mine=rows[rows.length-1];
          const bb=mine&&mine.querySelector(".bubble");if(bb)bb.textContent=acc;
          if(!typing.parentNode){/*already removed*/} else typing.remove?0:0;
          if(typing.isConnected===false){}
          scrollDown(false);
        }else if(o.type==="plan"){/* shown via plan chip below */ am.plan=o.content;
        }else if(o.type==="error"){am.error=true;acc+=o.content;}
      }
    }
  }catch(err){
    if(err&&err.name==="AbortError"){am.content=acc||t("stopped");}
    else{am.error=true;am.content=acc||("⚠️ "+t("err")+" ("+err.message+")");toast(t("err"),1);}
  }finally{
    if(am.content!==""||acc)am.content=acc;
    done();
  }
}
function setBusy(b){
  const s=$("btnSend");
  s.disabled=!b&&$("input").value.trim()==="";
  s.classList.toggle("stop",b);
  s.innerHTML=b?'<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
    :'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>';
}

/* ============================ info panel ============================ */
function renderInfo(){
  const c=curConv();
  const a=state.agents.find(x=>x.name===state.agent)||{name:t("agentDefault"),description:""};
  $("infoAgent").textContent=a.name||"—";
  $("infoAgentDesc").textContent=a.description||t("agentDefault");
  $("stMsg").textContent=c?((c.messages||[]).length||c.message_count||0):0;
  $("stTime").textContent=c?fmt(c.date||Date.now()):"—";
  $("stConn").textContent=navigator.onLine?t("online"):t("offline");
  const tools=$("infoTools");tools.innerHTML="";
  state.agents.slice(0,40).forEach(x=>{const s=document.createElement("span");s.className="tool";s.textContent=x.name;tools.appendChild(s);});
  if(state.agents.length>40){const s=document.createElement("span");s.className="tool";s.textContent="+"+(state.agents.length-40);tools.appendChild(s);}
}
function renderAgents(){
  const sel=$("agentSelect");sel.innerHTML="";
  const def=document.createElement("option");def.value="";def.textContent=t("agentDefault");sel.appendChild(def);
  state.agents.forEach(a=>{const o=document.createElement("option");o.value=a.name;o.textContent=a.name;sel.appendChild(o);});
  sel.value=state.agent||"";
  sel.onchange=()=>{state.agent=sel.value;renderInfo();};
}

/* ============================ overlays ============================ */
function closeAll(){$("sidebar").classList.remove("open");$("info").classList.remove("open");
  $("backdrop").classList.remove("show");$("searchModal").classList.remove("show");$("settingsModal").classList.remove("show");
  $("tracesModal").classList.remove("show");}
function openSearch(){closeAll();$("searchModal").classList.add("show");$("backdrop").classList.add("show");
  const inp=$("searchInput");inp.value="";searchRender("");inp.focus();}
async function searchRender(q){
  q=q.trim();const box=$("searchResults");box.innerHTML="";
  let list;
  if(useDB&&q){try{list=(await apiGet(API.convs+"?q="+encodeURIComponent(q))).conversations;}catch(e){list=[];}}
  else{const ql=q.toLowerCase();list=state.convs.filter(c=>!ql||(c.title||"").toLowerCase().includes(ql)||
    (c.messages||[]).some(m=>(m.content||"").toLowerCase().includes(ql)));}
  if(!list.length){box.innerHTML='<div style="color:var(--faint);padding:14px;text-align:center">—</div>';return;}
  list.forEach(c=>{const el=document.createElement("div");el.className="result";
    el.innerHTML='<div></div><div class="d"></div>';
    el.children[0].textContent=c.title||t("empty");
    el.children[1].textContent=fmt(c.date||c.updated_at||Date.now())+" · "+(c.message_count!=null?c.message_count:(c.messages||[]).length);
    el.onclick=async()=>{state.cur=c.id;if(!state.convs.find(x=>x.id===c.id))state.convs.unshift(c);
      saveCache();renderSidebar();await renderMessages();renderInfo();closeAll();};
    box.appendChild(el);});
}
/* ============================ time machine ============================ */
async function openTraces(){
  closeAll();
  $("tracesModal").classList.add("show");$("backdrop").classList.add("show");
  state.curTrace=null;
  const det=$("traceDetail");det.classList.remove("show");det.innerHTML="";
  const inp=$("traceSearch");inp.value="";
  inp.oninput=()=>renderTraces(inp.value);
  await renderTraces("");
  inp.focus();
}
async function renderTraces(q){
  const box=$("traceList");box.innerHTML="";
  let list;
  try{
    const url=q?API.traces+"?q="+encodeURIComponent(q):API.traces+"?limit=200";
    list=(await apiGet(url)).traces||[];
  }catch(e){list=[];}
  if(!list.length){box.innerHTML='<div style="color:var(--faint);padding:14px;text-align:center">'+t("noTraces")+'</div>';return;}
  list.forEach(tr=>{
    const el=document.createElement("div");
    el.className="trace-item"+(state.curTrace===tr.id?" sel":"");
    el.innerHTML='<div class="t"></div><div class="d"></div>';
    el.children[0].textContent=(tr.message||"").slice(0,80)||"—";
    el.children[1].textContent=fmt(tr.ts)+" · "+tr.latency_ms+"ms · "+tr.status+" · "+(tr.agent||t("agentDefault"));
    el.onclick=()=>openTraceDetail(tr.id);
    box.appendChild(el);
  });
}
async function openTraceDetail(tid){
  state.curTrace=tid;
  let tr;try{tr=await apiGet(API.traces+"/"+tid);}catch(e){toast(t("err"),1);return;}
  const d=$("traceDetail");d.classList.add("show");
  d.innerHTML='<h4>'+t("request")+'</h4><pre class="req"></pre>'+
    '<h4>'+t("response")+'</h4><pre class="res"></pre>'+
    '<div class="trace-detail-actions"></div>'+
    '<div class="trace-meta"></div>';
  d.querySelector(".req").textContent=tr.message||"—";
  d.querySelector(".res").textContent=tr.response||"—";
  d.querySelector(".trace-meta").textContent=
    fmt(tr.ts)+" · "+t("latency")+": "+tr.latency_ms+"ms · "+t("status")+": "+tr.status;
  const acts=d.querySelector(".trace-detail-actions");
  const bR=document.createElement("button");bR.className="pill";bR.textContent="↻ "+t("replay");
  const bJ=document.createElement("button");bJ.className="pill ghost";bJ.textContent="⬇ "+t("export")+" JSON";
  const bM=document.createElement("button");bM.className="pill ghost";bM.textContent="⬇ "+t("export")+" MD";
  acts.append(bR,bJ,bM);
  bR.onclick=()=>replayTrace(tid);
  bJ.onclick=()=>window.open(API.traces+"/"+tid+"/export?format=json","_blank");
  bM.onclick=()=>window.open(API.traces+"/"+tid+"/export?format=markdown","_blank");
  renderTraces($("traceSearch").value);
}
async function replayTrace(tid){
  const r=await apiSend("POST",API.traces+"/"+tid+"/replay",{});
  if(!r||!r.trace){toast(t("err"),1);return;}
  state.curTrace=r.trace.id;
  toast(t("replayDone"));
  await renderTraces($("traceSearch").value);
  openTraceDetail(r.trace.id);
}
function toast(msg,isErr){
  const el=document.createElement("div");el.className="toast"+(isErr?" err":"");el.textContent=msg;
  $("toasts").appendChild(el);setTimeout(()=>{el.style.opacity="0";el.style.transition="opacity .3s";setTimeout(()=>el.remove(),300)},2200);
}

/* ============================ input ============================ */
function autoGrow(){const el=$("input");el.style.height="auto";el.style.height=Math.min(el.scrollHeight,200)+"px";}

/* ============================ language ============================ */
function applyLang(){
  document.documentElement.lang=state.lang;
  document.documentElement.dir=state.lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  $("langTag").textContent=state.lang.toUpperCase();
  renderSidebar();renderMessages();renderInfo();
}

/* ============================ init ============================ */
function bind(){
  $("btnNew").onclick=()=>newChat();
  $("btnTopNew").onclick=()=>newChat();
  $("btnMenu").onclick=()=>{$("sidebar").classList.add("open");$("backdrop").classList.add("show");};
  $("btnInfo").onclick=()=>{$("info").classList.toggle("open");
    if(window.innerWidth>900){$("app").classList.toggle("no-info");state.stream=state.stream;}
    $("backdrop").classList.toggle("show",$("info").classList.contains("open")&&window.innerWidth<=900);};
  $("btnSearch").onclick=openSearch;
  $("btnTraces").onclick=openTraces;
  $("traceClear").onclick=()=>{if(confirm(t("clearTracesQ"))){apiSend("DELETE",API.traces);
    state.curTrace=null;const det=$("traceDetail");det.classList.remove("show");det.innerHTML="";
    renderTraces("");toast(t("del"));}};
  $("backdrop").onclick=closeAll;
  $("btnSettings").onclick=()=>{closeAll();$("settingsModal").classList.add("show");$("backdrop").classList.add("show");
    $("setInfo").classList.toggle("on",!$("app").classList.contains("no-info"));};
  $("setClose").onclick=closeAll;
  $("setLang").onclick=()=>{state.lang=state.lang==="ar"?"en":"ar";save();applyLang();toast("🌐 "+state.lang.toUpperCase());};
  $("btnLang").onclick=$("setLang").onclick;
  $("setClear").onclick=()=>{if(confirm(t("confirmClearQ"))){if(useDB)apiSend("DELETE",API.convs);
    state.convs=[];state.cur=null;saveCache();
    renderSidebar();renderMessages();renderInfo();closeAll();toast(t("del"));}};
  $("setInfo").onclick=()=>{$("app").classList.toggle("no-info");renderInfo();};
  $("tglInfo").onclick=()=>{$("app").classList.toggle("no-info");};
  $("tglStream").onclick=()=>{state.stream=!state.stream;$("tglStream").classList.toggle("on",state.stream);};
  $("searchInput").oninput=e=>searchRender(e.target.value);
  $("btnSend").onclick=()=>{if(state.streaming){state.ctrl&&state.ctrl.abort();}else send();};
  const inp=$("input");
  inp.addEventListener("input",()=>{autoGrow();$("charCount").textContent=inp.value.length;
    $("btnSend").disabled=!state.streaming&&!inp.value.trim();});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
  document.addEventListener("keydown",e=>{
    if(e.ctrlKey&&e.key.toLowerCase()==="k"){e.preventDefault();openSearch();}
    else if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="o"){e.preventDefault();newChat();}
    else if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="t"){e.preventDefault();openTraces();}
    else if(e.key==="Escape")closeAll();
  });
  document.addEventListener("click",e=>{const cp=e.target.closest(".code-copy");
    if(cp){const c=codes[+cp.dataset.idx];if(c){navigator.clipboard.writeText(c.raw).then(()=>toast(t("copied"))).catch(()=>toast(t("err"),1));}}});
  window.addEventListener("online",()=>{renderInfo();toast("🟢 "+t("online"));});
  window.addEventListener("offline",()=>{renderInfo();toast("🔴 "+t("offline"),1);});
  const dot=$("statusDot");
  const sync=()=>{const on=navigator.onLine;dot.classList.toggle("off",!on);$("statusText").textContent=on?t("online"):t("offline");};
  window.addEventListener("online",sync);window.addEventListener("offline",sync);
}
async function boot(){
  bind();await load();applyLang();sync();
  if(!state.convs.length)await newChat();
  else{state.cur=state.cur||state.convs[0].id;renderSidebar();await renderMessages();renderInfo();}
  try{
    const r=await fetch(API.agents);const j=await r.json();
    state.agents=(j.tools||[]).map(x=>({name:x.name,description:x.description}));
    renderAgents();renderInfo();
  }catch(e){toast(t("err"),1);}
}
function sync(){const on=navigator.onLine;$("statusDot").classList.toggle("off",!on);
  $("statusText").textContent=on?t("online"):t("offline");}
boot();
</script>
</body>
</html>
