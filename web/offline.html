<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>nexus-core — غير متصل</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#212121;
    color:#ececec;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;text-align:center;padding:24px}
  .card{max-width:420px}
  .mark{width:84px;height:84px;margin:0 auto 22px;border-radius:20px;background:#10a37f;
    display:grid;place-items:center;font-size:40px}
  h1{font-size:22px;margin:0 0 10px}
  p{color:#9a9a9a;line-height:1.8;margin:0 0 22px}
  button{background:#10a37f;color:#fff;border:none;border-radius:10px;padding:11px 22px;
    font-size:15px;cursor:pointer;font-family:inherit}
  button:active{transform:scale(.98)}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">🧠</div>
    <h1>لا يوجد اتصال</h1>
    <p>أنت غير متصل بالشبكة الآن. الواجهة محفوظة على جهازك — وحين يعود الاتصال ستُرسل أي رسائل كانت في قائمة الانتظار تلقائياً.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
