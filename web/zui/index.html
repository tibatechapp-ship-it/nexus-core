<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus ZUI — واجهة البرمجة الموحدة</title>
<meta name="description" content="واجهة nexus-core الموحدة: حوار برمجي متدفق، مجلس حي، تتبع وتقييم وكلاء — بواجهة واحدة معتمدة.">
<link rel="manifest" href="/zui/manifest.json">
<link rel="icon" href="/zui/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/github-dark.min.css">
<link rel="stylesheet" href="/zui/css/zui.css">
<script>
(function(){
  try{
    var K="nexus_auth_token",tok=localStorage.getItem(K)||"";
    try{
      var u=new URL(location.href),q=u.searchParams.get("token");
      if(q){tok=q;localStorage.setItem(K,q);u.searchParams.delete("token");
        history.replaceState(null,"",u.pathname+(u.search||"")+u.hash);}
    }catch(e2){}
    if(!tok)return;
    var W=/^(POST|PUT|PATCH|DELETE)$/i,of=window.fetch;
    window.fetch=function(input,init){
      try{
        var rq=(typeof Request!=="undefined"&&input instanceof Request)?input:null;
        var m=(init&&init.method)||(rq?rq.method:"GET");
        if(W.test(String(m))){
          if(rq){
            var h1=new Headers(rq.headers);
            if(!h1.has("X-Auth-Token"))h1.set("X-Auth-Token",tok);
            input=new Request(rq,{headers:h1});
          }else{
            var h2=new Headers((init&&init.headers)||undefined);
            if(!h2.has("X-Auth-Token"))h2.set("X-Auth-Token",tok);
            init=Object.assign({},init,{headers:h2});
          }
        }
      }catch(e3){}
      return of.call(window,input,init);
    };
    var oo=XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open=function(m){
      if(W.test(String(m))){try{this.setRequestHeader("X-Auth-Token",tok);}catch(e4){}}
      return oo.apply(this,arguments);
    };
    window.__nexusAuth=true;
  }catch(e){}
})();
</script>
</head>
<body>
<div id="app">

  <!-- ══ الشريط الجانبي ══ -->
  <aside id="sidebar" aria-label="الشريط الجانبي">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">◈</span>
      <div class="brand-text">
        <strong data-i18n="brand">Nexus ZUI</strong>
        <small data-i18n="brandSub">واجهة البرمجة الموحدة</small>
      </div>
    </div>
    <button id="newChatBtn" class="btn-primary" data-i18n="newChat">محادثة جديدة</button>
    <nav id="convList" aria-label="المحادثات"></nav>
    <div class="sidebar-foot">
      <div id="statusPills" class="pills"></div>
      <button id="langToggle" class="btn-ghost" data-i18n="langToggle">English</button>
    </div>
  </aside>

  <!-- ══ المنطقة الرئيسية ══ -->
  <main id="main">
    <header id="topbar">
      <button id="burger" class="icon-btn" aria-label="القائمة">☰</button>
      <label class="agent-picker">
        <span data-i18n="agent">الوكيل</span>
        <select id="agentSelect" aria-label="اختيار الوكيل"></select>
      </label>
      <div class="topbar-spacer"></div>
      <span id="connPill" class="pill pill-ok" data-i18n="connecting">يتصل…</span>
      <button id="panelToggle" class="icon-btn" aria-label="لوحة الأدوات">🛠</button>
    </header>

    <section id="chat" aria-label="الحوار" aria-live="polite">
      <div id="welcome" class="welcome">
        <div class="welcome-logo">◈</div>
        <h1 data-i18n="welcomeTitle">بماذا أساعدك اليوم؟</h1>
        <p data-i18n="welcomeSub">اكتب هدفك البرمجي — يوجهه التوجيه العرقي للوكيل الأنسب، والمجلس لا يتدخل إلا عند العجز أو بطلبك.</p>
        <div class="chips" id="chips">
          <button class="chip" data-chip="راجع جودة الكود في src/orchestrator واقترح تحسينات محددة">مراجعة كود</button>
          <button class="chip" data-chip="اكتب اختبارات شاملة لدالة route في src/orchestrator/router.py">اكتب اختبارات</button>
          <button class="chip" data-chip="اشرح لي معمارية التوجيه الموحد في هذا المشروع بإيجاز">اشرح المعمارية</button>
          <button class="chip" data-chip="قيّم أداء وكلاء الأسطول من سجل التتبع وحدد من يحتاج إعادة تعليم">قيّم الوكلاء</button>
        </div>
      </div>
      <div id="messages"></div>
    </section>

    <footer id="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" data-i18n-placeholder="placeholder"
          placeholder="اكتب هدفك… (Enter للإرسال، Shift+Enter لسطر جديد)"></textarea>
        <button id="sendBtn" class="btn-primary" data-i18n="send">إرسال</button>
      </div>
      <small class="composer-hint" data-i18n="hint">
        الإجابات متدفقة عبر SSE — شارة الوكيل تظهر من أول حدث plan.
      </small>
    </footer>
  </main>

  <!-- ══ لوحة الأدوات الجانبية ══ -->
  <aside id="panel" aria-label="لوحة الأدوات">
    <header class="panel-head">
      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="agents" data-i18n="tabAgents">الوكلاء</button>
        <button class="tab" data-tab="council" data-i18n="tabCouncil">المجلس</button>
        <button class="tab" data-tab="traces" data-i18n="tabTraces">التتبع</button>
        <button class="tab" data-tab="monitor" data-i18n="tabMonitor">التقييم</button>
      </nav>
      <button id="panelClose" class="icon-btn" aria-label="إغلاق">✕</button>
    </header>
    <div id="panelBody" class="panel-body"></div>
  </aside>

  <div id="toasts" aria-live="assertive"></div>
</div>
<script src="/zui/js/zui.js" defer></script>
</body>
</html>
