<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus Control Room</title>
<style>
:root{
  --bg: #1a1a1f;
  --bg-2: #22222a;
  --bg-3: #2c2c36;
  --line: #3a3a45;
  --text: #f5f5f4;
  --text-dim: #9ca3af;
  --accent: #f59e0b;
  --accent-2: #0ea5e9;
  --green: #10b981;
  --red: #ef4444;
  --amber: #f59e0b;
  --purple: #a78bfa;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
}
/* Header */
header{
  padding:16px 20px;
  background:linear-gradient(180deg,var(--bg-2),var(--bg));
  border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{font-size:1.8em}
.logo h1{font-size:1.2em;font-weight:700;letter-spacing:-.5px}
.logo p{font-size:.75em;color:var(--text-dim);margin-top:2px}
.stats{display:flex;gap:20px;font-size:.85em}
.stat-item{text-align:center}
.stat-item b{display:block;font-size:1.3em;color:var(--accent);font-weight:700}
.stat-item span{color:var(--text-dim);font-size:.7em}

/* Layout */
.main{display:flex;flex:1;overflow:hidden}
.chat-area{flex:1;display:flex;flex-direction:column;max-width:900px;margin:0 auto;width:100%}
.messages{flex:1;overflow-y:auto;padding:20px;scroll-behavior:smooth}
.messages::-webkit-scrollbar{width:6px}
.messages::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* Message bubbles */
.msg{margin-bottom:20px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-user{text-align:left}
.msg-user .bubble{
  display:inline-block;background:linear-gradient(135deg,#0369a1,#0ea5e9);
  padding:12px 18px;border-radius:18px 18px 4px 18px;
  max-width:80%;text-align:right;line-height:1.5;
}
.msg-system .bubble{
  background:var(--bg-3);padding:14px 18px;border-radius:18px;
  border:1px solid var(--line);line-height:1.6;
}

/* Agent Theater */
.theater{
  background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(167,139,250,.08));
  border:1px solid var(--line);border-radius:16px;padding:16px;
  margin-top:10px;
}
.theater-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;font-size:.85em;color:var(--text-dim);
}
.theater-head b{color:var(--accent)}
.agents{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.agent{
  background:var(--bg-3);border:1px solid var(--line);
  border-radius:12px;padding:12px;text-align:center;
  transition:all .3s;position:relative;overflow:hidden;
}
.agent::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--line);transition:all .3s;
}
.agent.profiler::before{background:var(--red)}
.agent.analyst::before{background:var(--green)}
.agent.critic::before{background:var(--amber)}
.agent.working{
  border-color:var(--accent);
  box-shadow:0 0 20px rgba(245,158,11,.15);
}
.agent.working .status-dot{animation:pulse 1s infinite}
.agent.done{opacity:.7}
.agent-icon{font-size:1.5em;margin-bottom:6px}
.agent-name{font-size:.8em;font-weight:600}
.agent-role{font-size:.7em;color:var(--text-dim);margin-top:2px}
.status-dot{
  width:8px;height:8px;border-radius:50%;
  display:inline-block;margin-left:4px;
  background:var(--text-dim);
}
.agent.working .status-dot{background:var(--accent)}
.agent.done .status-dot{background:var(--green)}

@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.6)}
  50%{box-shadow:0 0 0 8px rgba(245,158,11,0)}
}

/* Verdict */
.verdict-card{
  margin-top:12px;padding:14px 18px;border-radius:12px;
  background:var(--bg-3);border:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
}
.verdict-label{font-size:.85em;color:var(--text-dim)}
.verdict-value{font-size:1.1em;font-weight:700}
.verdict-value.approve{color:var(--green)}
.verdict-value.reject{color:var(--red)}
.verdict-value.human_review{color:var(--amber)}

/* Transcript */
.transcript{margin-top:14px}
.speak{
  background:var(--bg-3);border-right:3px solid var(--line);
  padding:12px;border-radius:10px;margin-bottom:8px;
  font-size:.9em;line-height:1.6;
  animation:slideIn .3s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.speak.profiler{border-right-color:var(--red)}
.speak.analyst{border-right-color:var(--green)}
.speak.critic{border-right-color:var(--amber)}
.speak-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:.8em}
.speak-badge{padding:2px 8px;border-radius:6px;font-weight:600}
.speak-badge.profiler{background:var(--red)}
.speak-badge.analyst{background:var(--green);color:#000}
.speak-badge.critic{background:var(--amber);color:#000}
.speak-phase{color:var(--text-dim);font-size:.85em}

/* Input area */
.input-area{
  padding:16px 20px 20px;
  background:linear-gradient(0deg,var(--bg-2),var(--bg));
  border-top:1px solid var(--line);
}
.input-wrap{
  display:flex;gap:10px;max-width:900px;margin:0 auto;
  background:var(--bg-3);border:1px solid var(--line);
  border-radius:16px;padding:6px;transition:all .2s;
}
.input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(245,158,11,.08)}
textarea{
  flex:1;background:transparent;border:none;color:var(--text);
  padding:10px 14px;font-family:inherit;font-size:1em;
  resize:none;min-height:24px;max-height:120px;
  outline:none;line-height:1.5;
}
textarea::placeholder{color:var(--text-dim)}
.send-btn{
  background:linear-gradient(135deg,var(--accent),#d97706);
  color:#000;border:none;border-radius:12px;
  padding:10px 20px;cursor:pointer;font-weight:700;
  font-size:1em;transition:all .2s;font-family:inherit;
  display:flex;align-items:center;gap:6px;
}
.send-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,158,11,.3)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.hints{
  max-width:900px;margin:10px auto 0;
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
}
.hint{
  background:var(--bg-3);border:1px solid var(--line);
  color:var(--text-dim);padding:6px 12px;border-radius:100px;
  font-size:.8em;cursor:pointer;transition:all .2s;
}
.hint:hover{color:var(--accent);border-color:var(--accent)}

/* Loading dots */
.loading-dots{display:inline-flex;gap:4px;align-items:center}
.loading-dots span{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:bounce 1.4s infinite ease-in-out both;
}
.loading-dots span:nth-child(1){animation-delay:-.32s}
.loading-dots span:nth-child(2){animation-delay:-.16s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}

/* Mobile */
@media(max-width:600px){
  .logo h1{font-size:1em}
  .stats{gap:12px}
  .stat-item b{font-size:1.1em}
  .agents{grid-template-columns:repeat(3,1fr);gap:6px}
  .agent{padding:8px 6px}
  .agent-icon{font-size:1.2em}
  .msg-user .bubble{max-width:90%}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🏛️</div>
    <div>
      <h1>Nexus Control Room</h1>
      <p>79 وكيل · 41 اختبار · v0.17.0</p>
    </div>
  </div>
  <div class="stats">
    <div class="stat-item"><b id="sAgents">—</b><span>وكيل</span></div>
    <div class="stat-item"><b id="sCalls">—</b><span>استدعاء</span></div>
    <div class="stat-item"><b id="sCost">—</b><span>تكلفة</span></div>
  </div>
</header>

<div class="main">
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="msg msg-system">
        <div class="bubble">
          <b>مرحباً! 👋</b><br>
          أنا Nexus — منصة 79 وكيل ذكي.<br><br>
          اكتب طلبك، وسيتحاور الوكلاء لخدمتك.<br>
          <span style="color:var(--text-dim);font-size:.9em">
            جرّب: "هل نستخدم SQLite أم PostgreSQL؟" أو "افحص ثغرات أمنية"
          </span>
        </div>
      </div>
    </div>
    <div class="input-area">
      <div class="input-wrap">
        <textarea id="input" placeholder="اكتب طلبك... (Enter للإرسال)" rows="1"></textarea>
        <button class="send-btn" id="sendBtn" onclick="send()">▶ إرسال</button>
      </div>
      <div class="hints">
        <div class="hint" onclick="quick('هل نستخدم SQLite أم PostgreSQL؟')">🗄️ SQLite vs PostgreSQL</div>
        <div class="hint" onclick="quick('افحص ثغرات أمنية في production')">🔒 فحص أمني</div>
        <div class="hint" onclick="quick('هل نستخدم FastAPI أم Flask؟')">⚡ FastAPI vs Flask</div>
        <div class="hint" onclick="quick('هل نستخدم Python أم Rust؟')">🚀 Python vs Rust</div>
      </div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const messages=$('messages');
const input=$('input');
const sendBtn=$('sendBtn');

// Auto-resize textarea
input.addEventListener('input',()=>{
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,120)+'px';
});

// Enter to send
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});

function quick(text){
  input.value=text;
  send();
}

async function send(){
  const text=input.value.trim();
  if(!text||sendBtn.disabled)return;

  // Add user message
  addUserMsg(text);
  input.value='';
  input.style.height='auto';
  sendBtn.disabled=true;

  // Create agent theater
  const theaterId='theater_'+Date.now();
  addTheater(theaterId);

  // Start council
  try{
    const r=await fetch('/api/smart/run',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt:text})
    });
    const d=await r.json();
    await finishTheater(theaterId,d);
    if(d.ok)loadStats();
  }catch(e){
    finishTheaterError(theaterId,e.message);
  }

  sendBtn.disabled=false;
}

function addUserMsg(text){
  const div=document.createElement('div');
  div.className='msg msg-user';
  div.innerHTML='<div class="bubble"></div>';
  div.querySelector('.bubble').textContent=text;
  messages.appendChild(div);
  scrollDown();
}

function addTheater(id){
  const div=document.createElement('div');
  div.className='msg msg-system';
  div.id=id;
  div.innerHTML=`
    <div class="bubble">
      <div class="theater">
        <div class="theater-head">
          <span>🏛️ <b>مجلس الوكلاء</b> يتحاور...</span>
          <span class="loading-dots"><span></span><span></span><span></span></span>
        </div>
        <div class="agents">
          <div class="agent profiler working" data-role="profiler">
            <div class="agent-icon">🔴</div>
            <div class="agent-name">Profiler</div>
            <div class="agent-role">محلل المخاطر<span class="status-dot"></span></div>
          </div>
          <div class="agent analyst" data-role="analyst">
            <div class="agent-icon">🟢</div>
            <div class="agent-name">Analyst</div>
            <div class="agent-role">مدافع<span class="status-dot"></span></div>
          </div>
          <div class="agent critic" data-role="critic">
            <div class="agent-icon">🟡</div>
            <div class="agent-name">Critic</div>
            <div class="agent-role">ناقد<span class="status-dot"></span></div>
          </div>
        </div>
        <div class="theater-status" style="margin-top:12px;font-size:.85em;color:var(--text-dim)">
          ⏳ في انتظار الرد...
        </div>
      </div>
    </div>`;
  messages.appendChild(div);
  scrollDown();
}

async function finishTheater(id,d){
  const theater=$('theater_'+id.split('_')[1]);
  if(!theater)return;

  // Mark agents done
  theater.querySelectorAll('.agent').forEach(a=>{
    a.classList.remove('working');
    a.classList.add('done');
  });
  theater.querySelector('.loading-dots')?.remove();

  if(!d.ok){
    finishTheaterError(id,d.error||'unknown error');
    return;
  }

  const verdictClass=d.verdict;
  const verdictEmoji=d.verdict==='approve'?'✅':d.verdict==='reject'?'❌':'⚠️';

  let transcriptHTML='';
  (d.transcript||[]).forEach(e=>{
    transcriptHTML+=`
      <div class="speak ${e.member}">
        <div class="speak-head">
          <span class="speak-badge ${e.member}">${e.member}</span>
          <span class="speak-phase">${e.phase}</span>
        </div>
        <div>${escapeHtml(e.response)}</div>
      </div>`;
  });

  theater.innerHTML=`
    <div class="bubble">
      <div class="theater">
        <div class="theater-head">
          <span>🏛️ <b>مجلس الوكلاء</b> — اكتمل</span>
          <span style="color:var(--text-dim)">${d.rounds} جولة · ${d.elapsed.toFixed(1)}ث</span>
        </div>
        <div class="agents">
          <div class="agent profiler done"><div class="agent-icon">🔴</div><div class="agent-name">Profiler</div><div class="agent-role">✅ اكتمل</div></div>
          <div class="agent analyst done"><div class="agent-icon">🟢</div><div class="agent-name">Analyst</div><div class="agent-role">✅ اكتمل</div></div>
          <div class="agent critic done"><div class="agent-icon">🟡</div><div class="agent-name">Critic</div><div class="agent-role">✅ اكتمل</div></div>
        </div>
        <div class="verdict-card">
          <div>
            <div class="verdict-label">القرار النهائي</div>
            <div class="verdict-value ${verdictClass}">${verdictEmoji} ${d.verdict.toUpperCase()}</div>
          </div>
          <div style="text-align:left">
            <div class="verdict-label">النقاط</div>
            <div class="verdict-value">${d.score.toFixed(2)}</div>
          </div>
        </div>
        <div class="transcript">${transcriptHTML}</div>
      </div>
    </div>`;
  scrollDown();
}

function finishTheaterError(id,error){
  const theater=$('theater_'+id.split('_')[1]);
  if(!theater)return;
  theater.innerHTML=`
    <div class="bubble" style="border-color:var(--red)">
      <b style="color:var(--red)">❌ خطأ</b><br>
      <span style="color:var(--text-dim)">${escapeHtml(String(error))}</span>
    </div>`;
  scrollDown();
}

function scrollDown(){
  messages.scrollTop=messages.scrollHeight;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadStats(){
  try{
    const r=await fetch('/api/status');
    const d=await r.json();
    $('sAgents').textContent=d.agents;
    $('sCost').textContent='$'+(d.cost||0).toFixed(4);
  }catch(e){}
  try{
    const m=await fetch('/api/metrics/today');
    const d=await m.json();
    if(d.ok){
      $('sCalls').textContent=d.stats.total_calls;
      $('sCost').textContent='$'+d.stats.total_cost_usd.toFixed(4);
    }
  }catch(e){}
}

loadStats();
setInterval(loadStats,20000);
</script>
</body>
</html>
