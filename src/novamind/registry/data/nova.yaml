pipelines:
  system_creation:
    name: System Creation
    description: من spec → نظام كامل (production-ready)
    stages:
    - agent: analyzer
      output_key: analysis
    - agent: task_planner
      output_key: plan
    - agent: coder
      output_key: code
    - agent: lint_agent
      output_key: lint
    - agent: type_agent
      output_key: types
    - agent: test_generator
      output_key: tests
    - agent: code_review
      output_key: review
    - agent: security
      output_key: security
    - agent: docker
      output_key: docker
    - agent: docs_writer
      output_key: docs
  bug_fix:
    name: Bug Fix
    description: إصلاح خطأ
    stages:
    - agent: analyzer
      output_key: analysis
    - agent: debug_agent
      output_key: diagnosis
    - agent: fixer
      output_key: fix
    - agent: test_runner
      output_key: test_result
  code_review:
    name: Code Review
    description: مراجعة شاملة
    stages:
    - agent: code_review
      output_key: review
    - agent: security
      output_key: security
    - agent: lint_agent
      output_key: lint
    - agent: type_agent
      output_key: types
  deploy:
    name: Deploy
    description: نشر نظام
    stages:
    - agent: docker
      output_key: docker
    - agent: deploy_agent
      output_key: deployment
    - agent: monitor_agent
      output_key: monitoring
providers:
  list:
  - gemini
  - glm
  - groq
  - mistral
  - ollama
  - openrouter
