<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🧠 NovaMind Platform</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
    --bd: #30363d; --tx: #c9d1d9; --dim: #8b949e;
    --blue: #58a6ff; --green: #3fb950; --red: #f85149;
    --yellow: #d29922; --purple: #bc8cff;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--tx);
    min-height: 100vh;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 0; border-bottom: 1px solid var(--bd);
    margin-bottom: 20px;
  }
  header .logo { font-size: 2em; }
  header h1 { font-size: 1.3em; color: var(--blue); }
  header .status {
    margin-right: auto; display: flex; align-items: center; gap: 6px;
    font-size: 0.85em; color: var(--dim);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .dot.off { background: var(--red); }
  
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab {
    padding: 8px 16px; background: var(--bg2); color: var(--dim);
    border: 1px solid var(--bd); border-radius: 8px;
    cursor: pointer; font-size: 0.9em;
  }
  .tab.active { background: var(--blue); color: white; border-color: var(--blue); }
  
  .panel { display: none; }
  .panel.active { display: block; }
  
  .card {
    background: var(--bg2); border: 1px solid var(--bd);
    border-radius: 10px; padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 1.1em; color: var(--blue); margin-bottom: 12px; }
  
  input, textarea, select {
    width: 100%; padding: 12px;
    background: var(--bg3); color: var(--tx);
    border: 1px solid var(--bd); border-radius: 8px;
    font-size: 1em; font-family: inherit;
    margin-bottom: 10px;
    outline: none;
  }
  input:focus, textarea:focus { border-color: var(--blue); }
  textarea { resize: vertical; min-height: 100px; }
  
  button {
    padding: 12px 24px; background: var(--blue); color: white;
    border: none; border-radius: 8px;
    font-size: 1em; font-weight: bold; cursor: pointer;
    transition: 0.2s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: var(--bg3); color: var(--tx); }
  button.green { background: var(--green); }
  
  .result {
    background: var(--bg3); border-radius: 8px;
    padding: 12px; margin-top: 12px;
    font-family: monospace; font-size: 0.85em;
    white-space: pre-wrap; word-break: break-word;
    max-height: 400px; overflow-y: auto;
    direction: ltr; text-align: left;
    display: none;
  }
  .result.show { display: block; }
  .result.success { border-right: 4px solid var(--green); }
  .result.error { border-right: 4px solid var(--red); }
  
  .msg {
    padding: 10px 14px; margin-bottom: 10px;
    border-radius: 12px; max-width: 80%;
    line-height: 1.5; word-wrap: break-word;
  }
  .msg.user {
    background: var(--blue); color: white;
    margin-right: auto; margin-left: 0;
  }
  .msg.bot {
    background: var(--bg3);
    margin-left: auto; margin-right: 0;
  }
  .chat-messages {
    display: flex; flex-direction: column;
    min-height: 300px; max-height: 500px;
    overflow-y: auto; padding: 16px;
    background: var(--bg3); border-radius: 10px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <span class="logo">🧠</span>
    <h1>NovaMind Platform</h1>
    <div class="status">
      <span class="dot" id="health-dot"></span>
      <span id="health-text">جاري...</span>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="showPanel('auth', this)">🔐 الحساب</div>
    <div class="tab" onclick="showPanel('chat', this)">💬 المحادثة</div>
    <div class="tab" onclick="showPanel('status', this)">📊 الحالة</div>
  </div>

  <!-- ═══════════════════════════════ -->
  <!--  PANEL 1: AUTH                  -->
  <!-- ═══════════════════════════════ -->
  <div id="panel-auth" class="panel active">
    <div class="card">
      <h2>📝 تسجيل جديد</h2>
      <input id="reg-email" type="email" placeholder="البريد الإلكتروني" value="demo@novamind.ai">
      <input id="reg-username" type="text" placeholder="اسم المستخدم" value="demo">
      <input id="reg-name" type="text" placeholder="الاسم الكامل" value="Demo User">
      <input id="reg-password" type="password" placeholder="كلمة المرور (8+ أحرف)" value="DemoPass123!">
      <button onclick="register()">✅ إنشاء حساب</button>
      <div id="reg-result" class="result"></div>
    </div>

    <div class="card">
      <h2>🔑 تسجيل الدخول</h2>
      <input id="login-email" type="email" placeholder="البريد الإلكتروني" value="demo@novamind.ai">
      <input id="login-password" type="password" placeholder="كلمة المرور" value="DemoPass123!">
      <button onclick="login()" class="green">🔓 دخول</button>
      <div id="login-result" class="result"></div>
    </div>

    <div class="card" id="me-card" style="display:none;">
      <h2>👤 حسابي</h2>
      <div id="me-info"></div>
      <button onclick="logout()" class="secondary" style="margin-top: 12px;">🚪 خروج</button>
    </div>
  </div>

  <!-- ═══════════════════════════════ -->
  <!--  PANEL 2: CHAT                  -->
  <!-- ═══════════════════════════════ -->
  <div id="panel-chat" class="panel">
    <div class="card">
      <h2>💬 المحادثة</h2>
      <div class="chat-messages" id="chat-messages">
        <div class="msg bot">مرحباً! أنا NovaMind. اسألني أي شيء.</div>
      </div>
      <textarea id="chat-input" placeholder="اكتب رسالتك..." rows="2"></textarea>
      <button onclick="sendChat()" id="send-btn">📤 إرسال</button>
    </div>
  </div>

  <!-- ═══════════════════════════════ -->
  <!--  PANEL 3: STATUS                -->
  <!-- ═══════════════════════════════ -->
  <div id="panel-status" class="panel">
    <div class="card">
      <h2>📊 حالة النظام</h2>
      <button onclick="checkStatus()" class="secondary">🔄 تحديث</button>
      <div id="status-result" class="result show"></div>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let token = localStorage.getItem('nova_token') || '';

// ═══ TABS ═══
function showPanel(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

// ═══ RESULT HELPER ═══
function showResult(id, data, isError = false) {
  const el = document.getElementById(id);
  el.className = 'result show ' + (isError ? 'error' : 'success');
  el.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
}

// ═══ HEALTH CHECK ═══
async function checkHealth() {
  try {
    const r = await fetch(API + '/api/health');
    const d = await r.json();
    document.getElementById('health-dot').className = 'dot';
    document.getElementById('health-text').textContent = 
      `✅ متصل (${d.nova?.tools || 0} أدوات)`;
  } catch(e) {
    document.getElementById('health-dot').className = 'dot off';
    document.getElementById('health-text').textContent = '❌ غير متصل';
  }
}

// ═══ REGISTER ═══
async function register() {
  const data = {
    email: document.getElementById('reg-email').value,
    username: document.getElementById('reg-username').value,
    full_name: document.getElementById('reg-name').value,
    password: document.getElementById('reg-password').value,
  };
  try {
    const r = await fetch(API + '/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data),
    });
    const d = await r.json();
    if (r.ok && d.access_token) {
      token = d.access_token;
      localStorage.setItem('nova_token', token);
      showResult('reg-result', '✅ تم التسجيل بنجاح!\n\nToken: ' + token.slice(0, 50) + '...');
      loadMe();
    } else {
      showResult('reg-result', '❌ ' + (d.detail || 'فشل التسجيل'), true);
    }
  } catch(e) {
    showResult('reg-result', '❌ خطأ: ' + e.message, true);
  }
}

// ═══ LOGIN ═══
async function login() {
  const data = {
    email: document.getElementById('login-email').value,
    password: document.getElementById('login-password').value,
  };
  try {
    const r = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data),
    });
    const d = await r.json();
    if (r.ok && d.access_token) {
      token = d.access_token;
      localStorage.setItem('nova_token', token);
      showResult('login-result', '✅ تم الدخول بنجاح!');
      loadMe();
    } else {
      showResult('login-result', '❌ ' + (d.detail || 'فشل الدخول'), true);
    }
  } catch(e) {
    showResult('login-result', '❌ خطأ: ' + e.message, true);
  }
}

// ═══ LOAD ME ═══
async function loadMe() {
  if (!token) return;
  try {
    const r = await fetch(API + '/api/auth/me', {
      headers: {'Authorization': 'Bearer ' + token},
    });
    if (r.ok) {
      const d = await r.json();
      document.getElementById('me-card').style.display = 'block';
      document.getElementById('me-info').innerHTML = `
        <p><strong>البريد:</strong> ${d.email}</p>
        <p><strong>المستخدم:</strong> ${d.username}</p>
        <p><strong>الاسم:</strong> ${d.full_name}</p>
        <p><strong>الدور:</strong> ${d.role}</p>
        <p><strong>الطلبات:</strong> ${d.ai_requests_today}/${d.ai_requests_limit}</p>
      `;
    }
  } catch(e) { }
}

// ═══ LOGOUT ═══
function logout() {
  token = '';
  localStorage.removeItem('nova_token');
  document.getElementById('me-card').style.display = 'none';
  document.getElementById('reg-result').className = 'result';
  document.getElementById('login-result').className = 'result';
}

// ═══ CHAT ═══
async function sendChat() {
  if (!token) {
    alert('سجل الدخول أولاً');
    return;
  }
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;

  const messages = document.getElementById('chat-messages');
  messages.innerHTML += `<div class="msg user">${escapeHtml(msg)}</div>`;
  input.value = '';
  messages.scrollTop = messages.scrollHeight;

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.textContent = '⏳ يفكر...';

  try {
    // Timeout + AbortController
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 90000);  // 90s

    const r = await fetch(API + '/api/chat', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({message: msg}),
      signal: controller.signal,
    });

    clearTimeout(timeoutId);
    const d = await r.json();
    if (d.ok) {
      messages.innerHTML += `<div class="msg bot">${escapeHtml(d.response)}</div>`;
    } else {
      messages.innerHTML += `<div class="msg bot" style="color: var(--red);">❌ ${escapeHtml(d.error || d.detail || 'خطأ')}</div>`;
    }
  } catch(e) {
    messages.innerHTML += `<div class="msg bot" style="color: var(--red);">❌ خطأ: ${e.message}</div>`;
  }
  messages.scrollTop = messages.scrollHeight;
  btn.disabled = false;
  btn.textContent = '📤 إرسال';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ═══ STATUS ═══
async function checkStatus() {
  try {
    const r = await fetch(API + '/api/health');
    const d = await r.json();
    showResult('status-result', d);
  } catch(e) {
    showResult('status-result', '❌ خطأ: ' + e.message, true);
  }
}

// ═══ INIT ═══
checkHealth();
checkStatus();
setInterval(checkHealth, 10000);
if (token) loadMe();

// Enter to send
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChat();
  }
});
</script>
</body>
</html>
