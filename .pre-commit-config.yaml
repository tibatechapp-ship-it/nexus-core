# Pre-commit hooks — nexus-core
#
# Install (once):
#   pip install pre-commit
#   pre-commit install                      # commit hooks (fast)
#   pre-commit install --hook-type pre-push # push hooks (full gates)
#
# The local hooks below run EXACTLY the same gates as scripts/dev_check.sh,
# so a clean commit locally == a clean gate in CI. `language: system` means
# they use the tools already installed in the env (no hook-env downloads) —
# important on Termux where fetching hook environments is slow/fragile.

default_stages: [pre-commit]

repos:
  # ─── Basic file hygiene ───
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: mixed-line-ending

  # ─── Local gates (mirror scripts/dev_check.sh) ───
  - repo: local
    hooks:
      # Lint — fast, runs on staged Python files only.
      - id: ruff
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types: [python]
        pass_filenames: true

      # Every function is type-annotated (framework surface).
      - id: check-annotations
        name: check_annotations
        entry: python scripts/check_annotations.py
        language: system
        pass_filenames: false
        files: ^(src/|zyvo-.*\.py$)

      # Static types — slower, so only on push.
      - id: mypy-framework
        name: mypy (framework scope)
        entry: mypy zyvo-telegram.py zyvo-voice.py src
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Full test suite — slowest, push only.
      - id: pytest
        name: pytest (ignore tests/novamind)
        entry: pytest --ignore=tests/novamind -q
        language: system
        pass_filenames: false
        stages: [pre-push]
