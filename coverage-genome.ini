# Coverage profile for the Agent Genome layer (v2 + its v1-facing adapter).
#
# The repo-wide pyproject profile omits src/novamind/* (the legacy novamind
# server layer ships with its own coverage story), but genome v2 is NEW, pure,
# fully unit-tested code inside that tree — like the autopilot slices, it must
# be measured and held to the floor (P4.5 gate: 100%).
#
# P3 added src/novamind/genome/adapter.py (the v1 API over the one v2 store) and
# src/novamind/genome_migrate.py (the one-shot legacy import). Both are measured
# here too: the adapter is now the only path that writes council judgements.
#
# Run:
#   COVERAGE_RCFILE=coverage-genome.ini \
#     python -m pytest tests/test_genome_v2*.py tests/test_genome_adapter.py \
#       tests/test_genome_unification.py \
#     --cov=src.novamind.genome_v2 --cov=src.novamind.genome.adapter \
#     --cov=src.novamind.genome_migrate --cov-report=term-missing
[run]
branch = True
source = src/novamind

[report]
include = */genome_v2.py, */genome/adapter.py, */genome_migrate.py
show_missing = True
skip_empty = True
fail_under = 95

[paths]
source =
    src/novamind
    */src/novamind
