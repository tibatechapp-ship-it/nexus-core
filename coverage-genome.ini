# Coverage profile for the Agent Genome v2 (src/novamind/genome_v2.py).
#
# The repo-wide pyproject profile omits src/novamind/* (the legacy novamind
# server layer ships with its own coverage story), but genome v2 is NEW, pure,
# fully unit-tested code inside that tree — like the autopilot slices, it must
# be measured and held to the floor (P4.5 gate: 100%).
#
# Run:
#   COVERAGE_RCFILE=coverage-genome.ini \
#     python -m pytest tests/test_genome_v2*.py \
#     --cov=src.novamind.genome_v2 --cov-report=term-missing --cov-fail-under=95
[run]
branch = True
source = src/novamind

[report]
include = */genome_v2.py
show_missing = True
skip_empty = True
fail_under = 95

[paths]
source =
    src/novamind
    */src/novamind
